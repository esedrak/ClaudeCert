<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCAR-F Mock Exam #1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --deep-ocean: #002A41;
    --ocean: #1E5E82;
    --sky-blue: #81CCEA;
    --cloud: #EEF9FD;
    --flamingo: #D86E89;
    --white: #FFFFFF;
    --text-primary: #EEF9FD;
    --text-muted: #81CCEA;
    --surface: #0a3d57;
    --surface-raised: #0d4a6a;
    --border: #1E5E82;
    --correct-bg: #0d3d2a;
    --correct-border: #2d7a50;
    --correct-text: #6fcf97;
    --wrong-bg: #3d1522;
    --wrong-border: #a03050;
    --wrong-text: #f28b9e;
    --radius: 10px;
    --radius-sm: 6px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--deep-ocean);
    color: var(--white);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 0 80px;
  }

  /* ── Header ────────────────────────────────── */
  .site-header {
    width: 100%;
    background: var(--surface);
    border-bottom: 2px solid var(--flamingo);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 36px;
  }
  .logo-wordmark {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }
  .logo-icon {
    width: 36px;
    height: 24px;
    background: linear-gradient(135deg, var(--flamingo) 0%, var(--sky-blue) 100%);
    border-radius: 4px;
    flex-shrink: 0;
  }
  .logo-text {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--white);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .header-badge {
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--sky-blue);
    background: rgba(129,204,234,0.12);
    padding: 5px 12px;
    border-radius: 99px;
    border: 1px solid rgba(129,204,234,0.25);
  }

  /* ── Layout ────────────────────────────────── */
  .container {
    width: 100%;
    max-width: 780px;
    padding: 0 20px;
  }

  /* ── Exam intro strip ───────────────────────── */
  .exam-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .exam-meta h1 {
    font-size: 1.35rem;
    font-weight: 600;
    color: var(--white);
    letter-spacing: -0.01em;
    flex: 1;
  }
  .exam-pill {
    font-size: 0.72rem;
    font-weight: 500;
    color: var(--cloud);
    background: rgba(238,249,253,0.08);
    border: 1px solid rgba(238,249,253,0.15);
    border-radius: 99px;
    padding: 4px 12px;
  }

  /* ── Progress ───────────────────────────────── */
  .progress-wrap { margin-bottom: 28px; }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    color: var(--sky-blue);
    font-weight: 500;
    margin-bottom: 8px;
  }
  .progress-bar-bg {
    background: var(--surface);
    border-radius: 99px;
    height: 5px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--flamingo), var(--sky-blue));
    border-radius: 99px;
    transition: width 0.4s ease;
  }

  /* ── Question card ──────────────────────────── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    width: 100%;
    margin-bottom: 20px;
    border-top: 3px solid var(--flamingo);
  }

  /* Domain tag */
  .domain-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    padding: 4px 11px;
    border-radius: 99px;
    margin-bottom: 14px;
  }
  .d1 { background: rgba(216,110,137,0.14); color: var(--flamingo); border: 1px solid rgba(216,110,137,0.3); }
  .d2 { background: rgba(129,204,234,0.14); color: var(--sky-blue); border: 1px solid rgba(129,204,234,0.3); }
  .d3 { background: rgba(30,94,130,0.25);   color: #7ec8e8;                border: 1px solid rgba(30,94,130,0.5); }
  .d4 { background: rgba(216,110,137,0.08); color: #e8a0b3;                border: 1px solid rgba(216,110,137,0.2); }
  .d5 { background: rgba(129,204,234,0.08); color: #a8dff2;                border: 1px solid rgba(129,204,234,0.2); }

  .q-number {
    font-size: 0.75rem;
    font-weight: 500;
    color: rgba(255,255,255,0.35);
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .q-text {
    font-size: 1rem;
    line-height: 1.7;
    color: var(--white);
    font-weight: 400;
    margin-bottom: 24px;
  }
  .q-text code {
    background: rgba(129,204,234,0.12);
    color: var(--sky-blue);
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 0.88em;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
  }

  /* Options */
  .options { display: flex; flex-direction: column; gap: 9px; }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 13px;
    padding: 13px 16px;
    background: rgba(0,42,65,0.6);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    text-align: left;
    width: 100%;
    color: rgba(255,255,255,0.85);
    font-size: 0.92rem;
    line-height: 1.55;
    font-family: 'Inter', sans-serif;
  }
  .option:hover:not(.disabled) {
    border-color: var(--sky-blue);
    background: rgba(129,204,234,0.07);
  }
  .option.disabled { cursor: default; }
  .option.correct {
    border-color: var(--correct-border);
    background: var(--correct-bg);
    color: var(--correct-text);
  }
  .option.wrong {
    border-color: var(--wrong-border);
    background: var(--wrong-bg);
    color: var(--wrong-text);
  }
  .option.reveal-correct {
    border-color: rgba(45,122,80,0.5);
    background: rgba(13,61,42,0.5);
    color: var(--correct-text);
  }
  .option code {
    background: rgba(129,204,234,0.12);
    color: var(--sky-blue);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 0.87em;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
  }

  .letter {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border-radius: 6px;
    background: rgba(129,204,234,0.08);
    border: 1px solid rgba(129,204,234,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--sky-blue);
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .option.correct .letter {
    background: var(--correct-border);
    border-color: var(--correct-border);
    color: var(--deep-ocean);
  }
  .option.wrong .letter {
    background: var(--wrong-border);
    border-color: var(--wrong-border);
    color: var(--white);
  }
  .option.reveal-correct .letter {
    background: var(--correct-border);
    border-color: var(--correct-border);
    color: var(--deep-ocean);
  }

  /* Explanation */
  .explanation {
    display: none;
    margin-top: 20px;
    padding: 18px 20px;
    background: rgba(30,94,130,0.15);
    border-left: 3px solid var(--ocean);
    border-radius: 0 8px 8px 0;
    font-size: 0.875rem;
    line-height: 1.7;
    color: rgba(255,255,255,0.75);
  }
  .explanation.visible { display: block; }
  .explanation strong { color: var(--white); font-weight: 600; }
  .explanation code {
    background: rgba(129,204,234,0.12);
    color: var(--sky-blue);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 0.87em;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
  }

  /* Next button */
  .btn-next {
    display: none;
    margin-top: 20px;
    padding: 11px 28px;
    background: var(--flamingo);
    color: var(--white);
    border: none;
    border-radius: 6px;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: background 0.15s, transform 0.1s;
    letter-spacing: 0.01em;
  }
  .btn-next:hover { background: #c45a77; }
  .btn-next:active { transform: scale(0.98); }
  .btn-next.visible { display: inline-flex; }

  /* ── Results ────────────────────────────────── */
  #results { display: none; width: 100%; max-width: 780px; padding: 0 20px; }

  .results-hero {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: 3px solid var(--flamingo);
    border-radius: 12px;
    padding: 44px 36px 36px;
    text-align: center;
    margin-bottom: 20px;
  }
  .score-ring-wrap {
    position: relative;
    width: 150px;
    height: 150px;
    margin: 0 auto 24px;
  }
  .score-ring-wrap svg {
    transform: rotate(-90deg);
    width: 150px;
    height: 150px;
  }
  .score-ring-wrap svg circle { fill: none; }
  .score-ring-track { stroke: var(--surface); stroke-width: 10; }
  .score-ring-fill { stroke: url(#scoreGrad); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset 0.8s ease; }
  .score-label {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }
  .score-label .big { font-size: 2.2rem; font-weight: 700; color: var(--white); line-height: 1; }
  .score-label .sub { font-size: 0.78rem; color: var(--sky-blue); font-weight: 500; margin-top: 2px; }
  .results-hero h2 {
    font-size: 1.3rem;
    font-weight: 600;
    color: var(--white);
    margin-bottom: 6px;
  }
  .results-hero p {
    font-size: 0.88rem;
    color: rgba(255,255,255,0.55);
    margin-bottom: 28px;
  }

  .breakdown-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 12px;
    text-align: left;
    margin-top: 4px;
  }
  .breakdown-cell {
    background: rgba(0,42,65,0.5);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .breakdown-cell .cell-label {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
  }
  .breakdown-cell .cell-bar-bg {
    height: 4px;
    background: rgba(255,255,255,0.08);
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .breakdown-cell .cell-bar-fill { height: 100%; border-radius: 99px; }
  .breakdown-cell .cell-score { font-size: 0.8rem; color: rgba(255,255,255,0.5); }

  .btn-restart {
    margin-top: 24px;
    padding: 11px 32px;
    background: transparent;
    border: 2px solid var(--ocean);
    color: var(--sky-blue);
    border-radius: 6px;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: background 0.15s, border-color 0.15s;
  }
  .btn-restart:hover {
    background: rgba(30,94,130,0.2);
    border-color: var(--sky-blue);
  }

  /* ── Footer ─────────────────────────────────── */
  .site-footer {
    margin-top: 60px;
    text-align: center;
    font-size: 0.72rem;
    color: rgba(255,255,255,0.2);
    font-weight: 400;
  }
</style>
</head>
<body>

<header class="site-header">
  <span class="header-badge">CCAR-F Exam Prep</span>
</header>

<div class="container">
  <div class="exam-meta">
    <h1>Mock Exam #1</h1>
    <span class="exam-pill">40 Questions</span>
    <span class="exam-pill">Single Answer</span>
    <span class="exam-pill">Claude Certified Architect – Foundations</span>
  </div>

  <div class="progress-wrap">
    <div class="progress-meta">
      <span id="prog-label">Question 1 of 40</span>
      <span id="prog-score">Score: 0</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
    </div>
  </div>

  <div id="quiz-area"></div>
</div>

<div id="results"></div>

<div class="site-footer">CCAR-F Study Materials</div>

<script>
const DOMAIN_LABELS = {
  D1: "Domain 1 · Agentic Architecture & Orchestration",
  D2: "Domain 2 · Tool Design & MCP Integration",
  D3: "Domain 3 · Claude Code Configuration & Workflows",
  D4: "Domain 4 · Prompt Engineering & Structured Output",
  D5: "Domain 5 · Context Management & Reliability"
};
const DOMAIN_CLASS = { D1:'d1', D2:'d2', D3:'d3', D4:'d4', D5:'d5' };
const DOMAIN_COLORS = {
  D1: '#D86E89', D2: '#81CCEA', D3: '#7ec8e8', D4: '#e8a0b3', D5: '#a8dff2'
};

const questions = [
  {
    domain: "D1",
    q: "An AI agent is processing a customer support request. After calling a <code>lookup_order</code> tool, the model returns a response with <code>stop_reason: \"tool_use\"</code>. What is the correct next step in the agentic loop?",
    options: [
      "Append the tool result to the messages array and call the API again.",
      "Return the partial response to the user and await further instructions.",
      "Reset the conversation context and restart with the tool result as a new user message.",
      "Set <code>stop_reason</code> to <code>\"end_turn\"</code> and finalize the response."
    ],
    answer: 0,
    explanation: "<strong>A is correct.</strong> When <code>stop_reason</code> is <code>\"tool_use\"</code>, the model is requesting tool execution. You must execute the tool, append the result to the messages array as a <code>tool</code>-role message, and call the API again.<br><br><strong>B</strong> — the response is not ready for the user yet. <strong>C</strong> — resetting context loses all conversation history. <strong>D</strong> — <code>stop_reason</code> is set by the model, not the developer."
  },
  {
    domain: "D2",
    q: "You are building a code analysis assistant with two tools: <code>search_code</code> and <code>find_references</code>. The model frequently calls <code>search_code</code> even when looking for function references. What is the most direct fix?",
    options: [
      "Consolidate the two tools into a single <code>code_analysis</code> tool with a <code>mode</code> parameter.",
      "Improve the tool descriptions to clearly differentiate when each tool should be used.",
      "Add a system prompt instruction: 'always prefer find_references for function lookups.'",
      "Rename <code>search_code</code> to something less generic, like <code>search_code_text</code>."
    ],
    answer: 1,
    explanation: "<strong>B is correct.</strong> Tool descriptions are the primary mechanism by which the model selects tools. Improving them to articulate distinct use cases is the most direct fix.<br><br><strong>A</strong> makes the interface harder to use. <strong>C</strong> creates a redundant instruction that fights with tool definitions. <strong>D</strong> is superficial and doesn't clarify purpose."
  },
  {
    domain: "D3",
    q: "A team uses Claude Code with <code>~/.claude/CLAUDE.md</code>, <code>/project/CLAUDE.md</code>, and <code>/project/src/api/CLAUDE.md</code>. When running in <code>/project/src/api/</code>, which files load and which takes precedence for conflicts?",
    options: [
      "The user-global file loads last and overrides directory-level instructions.",
      "Project-level loads first and is the primary source of truth for all sessions.",
      "All three load and are concatenated into context — no single file formally overrides another for conflicts.",
      "Only the nearest CLAUDE.md loads — the others are ignored once a local one is found."
    ],
    answer: 2,
    explanation: "<strong>C is correct.</strong> Claude Code loads all applicable CLAUDE.md files and concatenates them into context in order (global → project root → subdirectory). There is no formal precedence mechanism — if two rules conflict, Claude may pick one arbitrarily. The docs advise reviewing all CLAUDE.md files periodically to eliminate contradictions.<br><br><strong>D</strong> — they all load, not just the nearest. <strong>A</strong> — the global file loads first, not last, and does not override directory-level files. <strong>B</strong> — project-level is not a primary source of truth; all files are combined equally."
  },
  {
    domain: "D4",
    q: "Your team debates two moderation approaches:<br><strong>Option X:</strong> 'Flag content if confidence > 0.8'<br><strong>Option Y:</strong> 'Flag content containing threats of physical harm, personal information of minors, or weapons modification instructions.'<br><br>Which is recommended and why?",
    options: [
      "Option X, because confidence thresholds let the model self-calibrate based on context.",
      "Option X, because numeric thresholds are easier to tune and audit over time.",
      "Option Y only for critical categories; use confidence thresholds for edge cases.",
      "Option Y, because categorical criteria reduce false positives and produce more consistent decisions."
    ],
    answer: 3,
    explanation: "<strong>D is correct.</strong> LLM confidence scores are not calibrated probabilities — a score of 0.85 does not mean there is an 85% chance the content is harmful. These values shift with prompt wording, model version, and context, making them unreliable as a moderation signal. Explicit categorical criteria (specific harm types) create auditable, deterministic decision boundaries that do not depend on the model's internal scoring.<br><br><strong>A</strong> — 'self-calibration' is not a real property of LLM confidence outputs. <strong>B</strong> — numeric thresholds are not just harder to reason about; they are statistically unreliable for this use case. <strong>C</strong> — splitting the approach adds complexity without addressing the core unreliability of confidence thresholds."
  },
  {
    domain: "D4",
    q: "A legal document classifier mis-tags 'force majeure' clauses as 'termination' or 'limitation of liability.' What is the most effective intervention?",
    options: [
      "Add 2–4 labeled examples of force majeure clauses to the prompt, including near-miss examples that resemble each incorrect category.",
      "Increase model temperature to 0.7 so the classifier explores a wider range of interpretations.",
      "Add chain-of-thought: 'Think step by step before classifying.'",
      "Split force majeure into its own sub-classifier invoked only when the base classifier is uncertain."
    ],
    answer: 0,
    explanation: "<strong>A is correct.</strong> For ambiguous categories, 2–4 targeted few-shot examples (including near-miss distractors) demonstrate the boundary between confused classes most effectively.<br><br><strong>B</strong> increases randomness and worsens consistency. <strong>C</strong> helps but is less targeted than concrete examples. <strong>D</strong> over-engineers a problem that few-shot examples solve directly."
  },
  {
    domain: "D1",
    q: "A platform processes support tickets through four specialist agents: classify, retrieve history, draft response, and compliance review — each dependent on the prior. What orchestration pattern is most appropriate?",
    options: [
      "Each agent spawns the next, passing context as a chain (pipeline pattern).",
      "A coordinator agent spawns each specialist in sequence, collects outputs, and synthesizes the final response.",
      "All four agents receive the ticket simultaneously and vote on the best response.",
      "A single agent with four system prompts that switches between them based on the current step."
    ],
    answer: 1,
    explanation: "<strong>B is correct.</strong> This is the hub-and-spoke (coordinator) pattern — a central coordinator orchestrates specialist subagents and synthesizes results.<br><br><strong>A</strong> distributes coordinator logic and makes error handling harder. <strong>C</strong> is not appropriate for sequential dependent steps. <strong>D</strong> is not how multi-agent systems work in Claude Code."
  },
  {
    domain: "D5",
    q: "An agent processes financial reports for 2 hours. Context is approaching the token limit. A developer proposes progressive summarization to compress older messages. What is the key risk?",
    options: [
      "The model will refuse to process summarized content as if it were raw tool output.",
      "Summarized context increases the probability of hallucinating new tool calls.",
      "Progressive summarization can silently drop precise values like numbers and dates, corrupting downstream calculations.",
      "Compressing older messages invalidates the entire conversation cache, significantly increasing API costs."
    ],
    answer: 2,
    explanation: "<strong>C is correct.</strong> Progressive summarization is a known risk in financial/analytical contexts because summaries tend to lose precise values (numbers, dates, IDs).<br><br><strong>A</strong> — not true. <strong>B</strong> — not a documented property of summarization. <strong>D</strong> — cache invalidation is tied to message changes, not summarization."
  },
  {
    domain: "D1",
    q: "A coordinator agent needs to spawn a subagent to search a codebase. The subagent must not be able to write or delete files. How should this constraint be enforced?",
    options: [
      "Include in the subagent's system prompt: 'You are not permitted to write or delete files.'",
      "Monitor the subagent's output stream and terminate it if a write tool is called.",
      "Use a pre-built read-only agent definition that excludes write capabilities at model training time.",
      "Pass <code>allowedTools: [\"Grep\", \"Glob\", \"Read\"]</code> when invoking the Task tool to spawn the subagent."
    ],
    answer: 3,
    explanation: "<strong>D is correct.</strong> The Task tool accepts <code>allowedTools</code> to explicitly restrict which tools the subagent can use.<br><br><strong>A</strong> — prompt instructions are unreliable. <strong>B</strong> is reactive — the violation has already occurred. <strong>C</strong> — tool access is configured at runtime, not training time."
  },
  {
    domain: "D2",
    q: "A file-reading tool encounters a permissions error accessing <code>/etc/secrets.conf</code>. How should the tool return this error to the model?",
    options: [
      "Return a result with <code>isError: true</code>, <code>errorCategory: \"permission\"</code>, <code>isRetryable: false</code>, and a message explaining the denial.",
      "Return an empty string so the model knows no content was returned.",
      "Throw a runtime exception and let the orchestration framework handle it.",
      "Return <code>isError: true</code> with <code>isRetryable: true</code> so the model can retry with elevated permissions."
    ],
    answer: 0,
    explanation: "<strong>A is correct.</strong> Structured error responses include <code>isError: true</code>, an <code>errorCategory</code>, and <code>isRetryable</code> to guide the model. Permission errors are not retryable without external intervention.<br><br><strong>B</strong> gives no error signal. <strong>C</strong> bypasses graceful error handling. <strong>D</strong> — this is a permission error, not a transient one."
  },
  {
    domain: "D3",
    q: "A developer wants a <code>/code-review</code> skill: project-scoped only, isolated subagent (no context pollution), and accepts a filename argument. Which configuration is correct?",
    options: [
      "Create <code>~/.claude/commands/code-review.md</code> with a <code>paths:</code> frontmatter field listing the project directory.",
      "Create <code>.claude/skills/code-review/SKILL.md</code> in the project with <code>context: fork</code> and <code>argument-hint: \"&lt;filename&gt;\"</code> in the frontmatter.",
      "Create <code>.claude/commands/code-review.md</code> with a <code>scope: directory</code> field and <code>arg: filename</code>.",
      "Create <code>~/.claude/commands/code-review.md</code> with a <code>restricted-paths:</code> field pointing to the project directory."

    domain: "D3",
    q: "A team's <code>/security-audit</code> skill produces inconsistent reports because it accumulates context from prior development work. What SKILL.md frontmatter field prevents this context pollution?",
    options: [
      "<code>isolation: true</code> — runs the skill in an isolated process without prior context.",
      "<code>reset-context: before-run</code> — clears the model context before the skill executes.",
      "<code>context: fork</code> — creates an isolated subagent session, keeping prior conversation context out of the skill.",
      "<code>sandbox: enabled</code> — restricts the skill to a safe execution environment."
    ],
    answer: 2,
    explanation: "<strong>C is correct.</strong> <code>context: fork</code> in SKILL.md frontmatter creates an isolated subagent session — the skill starts with a clean context, unaffected by prior conversation history.<br><br><strong>A</strong> and <strong>B</strong> are not valid SKILL.md frontmatter fields. <strong>D</strong> — <code>sandbox: enabled</code> relates to execution safety, not context isolation."
  }
];

let current = 0;
let score = 0;
let answered = new Array(questions.length).fill(false);
const domainScores = { D1: [0,0], D2: [0,0], D3: [0,0], D4: [0,0], D5: [0,0] };

function updateProgress() {
  const pct = (current / questions.length) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('prog-label').textContent = `Question ${current + 1} of ${questions.length}`;
  document.getElementById('prog-score').textContent = `Score: ${score}`;
}

function renderQuestion(idx) {
  const q = questions[idx];
  const letters = ['A','B','C','D'];
  const html = `
    <div class="card">
      <div class="domain-tag ${DOMAIN_CLASS[q.domain]}">${DOMAIN_LABELS[q.domain]}</div>
      <div class="q-number">Question ${idx + 1} of ${questions.length}</div>
      <div class="q-text">${q.q}</div>
      <div class="options" id="options">
        ${q.options.map((opt, i) => `
          <button class="option" data-idx="${i}" onclick="selectAnswer(${i})">
            <span class="letter">${letters[i]}</span>
            <span>${opt}</span>
          </button>
        `).join('')}
      </div>
      <div class="explanation" id="explanation">${q.explanation}</div>
      <button class="btn-next" id="btn-next" onclick="nextQuestion()">
        ${idx === questions.length - 1 ? 'See Results' : 'Next Question →'}
      </button>
    </div>
  `;
  document.getElementById('quiz-area').innerHTML = html;
  updateProgress();
}

function selectAnswer(idx) {
  if (answered[current]) return;
  answered[current] = true;

  const q = questions[current];
  const buttons = document.querySelectorAll('.option');
  domainScores[q.domain][1]++;

  buttons.forEach((btn, i) => {
    btn.classList.add('disabled');
    if (i === idx) {
      if (i === q.answer) {
        btn.classList.add('correct');
        score++;
        domainScores[q.domain][0]++;
      } else {
        btn.classList.add('wrong');
      }
    } else if (i === q.answer) {
      btn.classList.add('reveal-correct');
    }
  });

  document.getElementById('explanation').classList.add('visible');
  document.getElementById('btn-next').classList.add('visible');
  document.getElementById('prog-score').textContent = `Score: ${score}`;
}

function nextQuestion() {
  current++;
  if (current >= questions.length) {
    showResults();
  } else {
    renderQuestion(current);
  }
}

function showResults() {
  document.getElementById('quiz-area').innerHTML = '';
  document.querySelector('.progress-wrap').style.display = 'none';

  const pct = Math.round((score / questions.length) * 100);
  const circumference = 2 * Math.PI * 60;
  const dash = (pct / 100) * circumference;

  let grade = '';
  if (pct >= 85) grade = 'Excellent — well above passing threshold';
  else if (pct >= 72) grade = 'Pass — at or above the 720/1000 threshold';
  else if (pct >= 55) grade = 'Close — review weaker domains and retry';
  else grade = 'More study needed — revisit the exam guide';

  const domainMeta = {
    D1: { label: 'D1 · Agentic Architecture', color: '#D86E89' },
    D2: { label: 'D2 · Tool Design & MCP',    color: '#81CCEA' },
    D3: { label: 'D3 · Claude Code Config',   color: '#7ec8e8' },
    D4: { label: 'D4 · Prompt Engineering',   color: '#e8a0b3' },
    D5: { label: 'D5 · Context & Reliability',color: '#a8dff2' }
  };

  const breakdownHtml = Object.entries(domainScores).map(([d, [got, total]]) => {
    const dpct = total > 0 ? Math.round((got / total) * 100) : 0;
    return `
      <div class="breakdown-cell">
        <div class="cell-label" style="color:${domainMeta[d].color}">${domainMeta[d].label}</div>
        <div class="cell-bar-bg">
          <div class="cell-bar-fill" style="width:${dpct}%;background:${domainMeta[d].color}"></div>
        </div>
        <div class="cell-score">${got} / ${total} &nbsp;(${dpct}%)</div>
      </div>`;
  }).join('');

  const resultsHtml = `
    <div class="results-hero">
      <div class="score-ring-wrap">
        <svg viewBox="0 0 150 150">
          <defs>
            <linearGradient id="scoreGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" style="stop-color:#D86E89"/>
              <stop offset="100%" style="stop-color:#81CCEA"/>
            </linearGradient>
          </defs>
          <circle class="score-ring-track" cx="75" cy="75" r="60"/>
          <circle class="score-ring-fill" cx="75" cy="75" r="60"
            stroke-dasharray="${circumference}"
            stroke-dashoffset="${circumference - dash}"/>
        </svg>
        <div class="score-label">
          <div class="big">${score}</div>
          <div class="sub">/ ${questions.length}</div>
        </div>
      </div>
      <h2>${pct}% — ${grade}</h2>
      <p>You answered ${score} out of ${questions.length} questions correctly.</p>
      <div class="breakdown-grid">${breakdownHtml}</div>
      <button class="btn-restart" onclick="restartExam()">Restart Exam</button>
    </div>
  `;

  const resultsEl = document.getElementById('results');
  resultsEl.innerHTML = resultsHtml;
  resultsEl.style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restartExam() {
  current = 0; score = 0;
  answered = new Array(questions.length).fill(false);
  for (const d in domainScores) domainScores[d] = [0,0];
  document.getElementById('results').style.display = 'none';
  document.querySelector('.progress-wrap').style.display = 'block';
  renderQuestion(0);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

renderQuestion(0);
</script>
</body>
</html>
