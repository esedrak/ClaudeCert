    .score-circle { width: 120px; height: 120px; border-radius: 50%; background: var(--ocean); color: var(--white); display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto 28px; }

    .domain-bar-wrap { width: 100px; height: 6px; background: var(--surface); border-radius: 100px; margin: 0 12px; overflow: hidden; }

    .restart-btn:hover { opacity: 0.88; }
    .question-view.hidden { display: none; }

<script>
const questions = [
  // Q1–20 (formerly Part 1)
  {
    domain: "Domain 1 — Agentic Architecture",
    text: "Your agentic loop receives a response from Claude with <code>stop_reason: \"end_turn\"</code> but the message contains no text and no tool calls. What is the correct action?",
    options: [
      "Treat it as a completed turn: append the empty assistant message to the conversation, then prompt the user for next steps.",
      "Immediately retry the same API call — empty <code>end_turn</code> responses are a transient error.",
      "Raise an exception: <code>stop_reason: \"end_turn\"</code> must always contain a text response.",
      "Re-append the last user message and call the API again to force a <code>tool_use</code> response."
    ],
    correct: 0,
    explanation: "<strong>A is correct.</strong> <code>stop_reason: \"end_turn\"</code> signals Claude has finished its turn, even if the response is empty — treat it as a completed turn. <strong>B</strong> risks an infinite loop. <strong>C</strong> is wrong: empty end_turn responses are valid. <strong>D</strong> would corrupt conversation history."
  },
  {
    domain: "Domain 1 — Agentic Architecture",
    text: "A content pipeline processes articles through three independent steps: fact-checking, tone analysis, and SEO scoring. No step depends on another's output. Which orchestration pattern is most appropriate?",
    options: [
      "Sequential chain — pass each article through steps one at a time to avoid rate limits.",
      "Hub-and-spoke with parallel subagent spawning — the coordinator dispatches all three tasks in a single response.",
      "<code>fork_session</code> — fork from a shared baseline so each agent starts with identical context.",
      "Iterative refinement — run each agent in sequence, feeding output back as input to the next."
    ],
    correct: 1,
    explanation: "<strong>B is correct.</strong> Independent parallel tasks with no dependencies are the ideal case for hub-and-spoke parallel spawning — the coordinator issues multiple Task calls in a single response. <strong>A</strong> wastes time. <strong>C</strong> is for divergent exploration, not production pipelines. <strong>D</strong> is for tasks where each pass improves on the last."
  },
  {
    domain: "Domain 1 — Agentic Architecture",
    text: "A coordinator spawns a subagent via the Task tool to analyse a 500-line code file. The subagent returns generic output unrelated to the actual file content. What is the most likely root cause?",
    options: [
      "The subagent used a less capable model that lacks code comprehension.",
      "The Task tool does not support file path arguments — only raw text can be passed.",
      "Subagents do not inherit coordinator context automatically; the file content was not explicitly passed.",
      "The subagent silently truncated the input after exceeding its token budget."
    ],
    correct: 2,
    explanation: "<strong>C is correct.</strong> Subagents do NOT inherit coordinator context — all relevant context must be explicitly passed in the Task tool's prompt. <strong>A</strong> is rarely the issue with well-specified tasks. <strong>B</strong> is false: Task supports any content. <strong>D</strong> would typically surface as an error, not silently generic output."
  },
  {
    domain: "Domain 1 — Agentic Architecture",
    text: "A developer needs to explore two competing architectural approaches from the same codebase state without the branches affecting each other. Which session feature is purpose-built for this?",
    options: [
      "<code>--resume</code> with two different session names, starting a fresh session for each approach.",
      "Running two parallel coordinator agents with different <code>allowedTools</code> configurations.",
      "Using <code>context: fork</code> in a SKILL.md to isolate each approach in a sub-agent.",
      "<code>fork_session</code>, which creates divergent sessions from a shared baseline."
    ],
    correct: 3,
    explanation: "<strong>D is correct.</strong> <code>fork_session</code> creates divergent sessions from a shared baseline — exactly this use case. <strong>A</strong> is wrong: <code>--resume</code> continues an existing named session. <strong>B</strong> doesn't satisfy the shared-baseline requirement. <strong>C</strong> prevents context pollution in skill invocations but is not a branched-exploration mechanism."
  },
  {
    domain: "Domain 1 — Agentic Architecture",
    text: "A pipeline must normalise file paths returned by a Read tool — converting Windows backslashes to forward slashes — before Claude processes them. Where should this transformation logic live?",
    options: [
      "In a PostToolUse hook, which intercepts tool results before they are appended to the model's context.",
      "In a PreToolUse hook, which can modify tool arguments before execution.",
      "As a system prompt instruction telling Claude to normalise paths in its responses.",
      "As a wrapper function around the Read tool that modifies its return value at the tool definition level."
    ],
    correct: 0,
    explanation: "<strong>A is correct.</strong> PostToolUse hooks intercept tool results after execution but before the model sees them — the correct place for output normalisation. <strong>B</strong> modifies inputs, not outputs. <strong>C</strong> is unreliable for data transformation. <strong>D</strong> couples normalisation to the tool, reducing reusability."
  },
  {
    domain: "Domain 1 — Agentic Architecture",
    text: "A workflow extracts structured data from legal contracts. Contracts vary significantly, and early extraction results sometimes reveal that later steps need a different strategy. Which decomposition approach is most appropriate?",
    options: [
      "Prompt chaining — define all steps upfront as a fixed sequence for predictability and auditability.",
      "Dynamic adaptive decomposition — allow the orchestrator to adjust subsequent steps based on intermediate results.",
      "Parallel subagent spawning — run all extraction steps simultaneously to minimise total latency.",
      "Single-prompt extraction — pass the full contract in one prompt to eliminate coordination overhead."
    ],
    correct: 1,
    explanation: "<strong>B is correct.</strong> When early results should influence later steps, dynamic adaptive decomposition is the right choice. <strong>A</strong> uses a fixed sequence and cannot adapt. <strong>C</strong> cannot handle inter-step dependencies. <strong>D</strong> often fails on long documents and cannot apply specialised, adaptive strategies."
  },
  {
    domain: "Domain 2 — Tool Design & MCP",
    text: "You have two tools: <code>search_documents</code> and <code>lookup_customer_record</code>. Claude frequently calls <code>search_documents</code> when performing customer lookups. What is the most effective fix?",
    options: [
      "Remove <code>search_documents</code> from available tools whenever customer lookup is the expected task.",
      "Add a system prompt instruction: \"Always use <code>lookup_customer_record</code> for customer data.\"",
      "Rewrite both tool descriptions to clearly differentiate when each should be called, using specific trigger scenarios.",
      "Rename <code>search_documents</code> to <code>search_general_documents</code> to make it semantically less attractive."
    ],
    correct: 2,
    explanation: "<strong>C is correct.</strong> Tool descriptions are the primary mechanism by which Claude selects tools. Clear, differentiated descriptions are the most direct fix. <strong>A</strong> works only when overlap is impossible. <strong>B</strong> is less reliable than tool-level descriptions. <strong>D</strong> is a surface rename that doesn't provide the semantic clarity needed."
  },
  {
    domain: "Domain 2 — Tool Design & MCP",
    text: "A tool returns <code>{\"error\": \"permission denied\"}</code> when a user lacks access. The orchestrator retries the call three times before failing. Which missing field would have prevented the retries?",
    options: [
      "<code>errorMessage</code> — a human-readable description of the error.",
      "<code>statusCode</code> — the HTTP-equivalent status code for the error.",
      "<code>errorCategory</code> — classifying the error as permission, validation, transient, or business logic.",
      "<code>isRetryable: false</code> — explicitly signalling that retrying will not resolve this error."
    ],
    correct: 3,
    explanation: "<strong>D is correct.</strong> The <code>isRetryable</code> flag tells the orchestrator whether to retry. Without it, the system defaults to retrying — wasting resources on a permission error that will never succeed. <strong>A</strong> aids humans but doesn't drive retry logic. <strong>B</strong> is not part of the structured error schema for tool responses. <strong>C</strong> classifies the error type but retry decisions depend specifically on <code>isRetryable</code>."
  },
  {
    domain: "Domain 2 — Tool Design & MCP",
    text: "A developer configures an MCP server in <code>~/.claude.json</code>. A colleague clones the repository and cannot see the MCP tools. What is the correct explanation and fix?",
    options: [
      "<code>~/.claude.json</code> is user-scoped; to share the MCP server with all collaborators, configure it in the project's <code>.mcp.json</code> file instead.",
      "The colleague must install the same Claude Code version — MCP servers are version-locked to the configuring user.",
      "MCP tools require explicit <code>allowedTools</code> entries in CLAUDE.md to be visible to other users.",
      "<code>~/.claude.json</code> must be committed to the repository; the colleague needs to pull the latest changes."
    ],
    correct: 0,
    explanation: "<strong>A is correct.</strong> <code>~/.claude.json</code> is user-scoped and lives only on the developer's machine. Project-scoped MCP config belongs in <code>.mcp.json</code> at the project root, committed and shared with all collaborators. <strong>B</strong> is false: MCP servers are not version-locked. <strong>C</strong> is wrong: <code>allowedTools</code> controls permissions, not visibility. <strong>D</strong> is wrong: committing personal user config is insecure and incorrect."
  },
  {
    domain: "Domain 3 — Claude Code Configuration",
    text: "A project has three CLAUDE.md files: <code>~/.claude/CLAUDE.md</code>, <code>./CLAUDE.md</code>, and <code>./src/CLAUDE.md</code>. Claude is invoked from the <code>./src/</code> directory. In what order are these files loaded?",
    options: [
      "Only <code>./src/CLAUDE.md</code> applies — Claude uses the nearest file and ignores parent directories.",
      "All three apply: user-level first, then project-level, then directory-level; more specific files take precedence on conflicts.",
      "<code>./CLAUDE.md</code> and <code>./src/CLAUDE.md</code> apply; <code>~/.claude/CLAUDE.md</code> is only loaded at startup.",
      "<code>~/.claude/CLAUDE.md</code> and <code>./src/CLAUDE.md</code> apply; intermediate <code>./CLAUDE.md</code> is skipped when a subdirectory file exists."
    ],
    correct: 1,
    explanation: "<strong>B is correct.</strong> Claude loads all CLAUDE.md files in the full hierarchy — user-level, project-level, then directory-level — simultaneously, with more specific files taking precedence on conflicts. <strong>A</strong> is wrong: nearest-file-only is not how the hierarchy works. <strong>C</strong> is wrong: user-level loads per-invocation, not just at startup. <strong>D</strong> is wrong: intermediate files are never skipped."
  },
  {
    domain: "Domain 3 — Claude Code Configuration",
    text: "You want a rule that applies only to TypeScript files matching <code>src/components/**/*.tsx</code>. Where should this rule be placed and how should it be scoped?",
    options: [
      "In <code>./CLAUDE.md</code> under a <code># Components</code> heading to indicate component scope.",
      "In <code>.claude/commands/components.md</code> with a <code>paths:</code> frontmatter key listing the glob.",
      "In <code>.claude/rules/components.yaml</code> with a <code>paths: [\"src/components/**/*.tsx\"]</code> frontmatter field.",
      "In <code>./src/components/CLAUDE.md</code> with an <code>@import</code> directive pointing to the rule content."
    ],
    correct: 2,
    explanation: "<strong>C is correct.</strong> Path-specific rules belong in <code>.claude/rules/</code> as YAML files with a <code>paths:</code> frontmatter glob pattern. <strong>A</strong> is wrong: CLAUDE.md headings provide no path scoping. <strong>B</strong> is wrong: <code>.claude/commands/</code> is for slash commands, not rules. <strong>D</strong> is wrong: a subdirectory CLAUDE.md applies to all files there — it can't scope to <code>.tsx</code> only."
  },
  {
    domain: "Domain 3 — Claude Code Configuration",
    text: "A developer asks Claude to add a <code>created_at</code> timestamp field to the User model and update the serialiser. Claude has already read both files and confirmed the change is additive and straightforward. What execution mode is most appropriate?",
    options: [
      "Plan mode — any model change could have cascading effects that require architectural review.",
      "Plan mode — multi-file changes always require user approval before Claude proceeds.",
      "Plan mode — the serialiser update introduces a schema dependency that needs explicit sign-off.",
      "Direct execution — the scope is well-defined, both files are known, and the task is a single focused change."
    ],
    correct: 3,
    explanation: "<strong>D is correct.</strong> Plan mode is for complex, architectural, or ambiguous tasks. A well-scoped two-file additive change with a clear requirement calls for direct execution — plan mode adds overhead without value. <strong>A</strong> is wrong: cascading effects concern structural refactors, not additive fields. <strong>B</strong> is wrong: multi-file scope doesn't automatically require plan mode. <strong>C</strong> is wrong: the serialiser update is mechanical, not a risk."
  },
  {
    domain: "Domain 3 — Claude Code Configuration",
    text: "You are integrating Claude Code into a CI pipeline to automatically review PRs. The pipeline must capture Claude's output as structured JSON for a downstream reporting tool. Which flag combination is correct?",
    options: [
      "<code>--print</code> with <code>--output-format json</code> — non-interactive mode with structured JSON output.",
      "<code>--json</code> with <code>--ci</code> — CI mode flag with JSON output format.",
      "<code>--structured</code> with <code>--no-interactive</code> — structured output with interactive mode disabled.",
      "<code>--format=json</code> with <code>--pipe</code> — pipe mode with format override."
    ],
    correct: 0,
    explanation: "<strong>A is correct.</strong> <code>-p</code> / <code>--print</code> enables non-interactive CI mode; <code>--output-format json</code> returns structured JSON output. <strong>B</strong>, <strong>C</strong>, and <strong>D</strong> all use flags that do not exist in Claude Code."
  },
  {
    domain: "Domain 4 — Prompt Engineering",
    text: "A content moderation prompt says: \"Flag this comment if you are more than 80% confident it is harmful.\" False positives in production are unacceptably high. What is the most effective fix?",
    options: [
      "Lower the confidence threshold to 60% to make the classifier less conservative.",
      "Replace the confidence threshold with explicit categorical criteria defining what constitutes harmful content.",
      "Add a second Claude instance to validate flagged items before they are actioned.",
      "Raise the threshold to 95% to make flagging significantly more conservative."
    ],
    correct: 1,
    explanation: "<strong>B is correct.</strong> Confidence thresholds produce inconsistent results because Claude's confidence estimates are not well-calibrated for external use. Categorical criteria — e.g., \"flag if the comment contains direct threats or slurs\" — give concrete decision rules that dramatically reduce false positives. <strong>A</strong> and <strong>D</strong> adjust the threshold without fixing the root cause. <strong>C</strong> adds cost but doesn't fix an ill-defined primary prompt."
  },
  {
    domain: "Domain 4 — Prompt Engineering",
    text: "A prompt extracts invoice line items as JSON. In testing, <code>amount</code> is sometimes a string and sometimes a number — inconsistent across responses. What is the most targeted fix?",
    options: [
      "Add a JSON schema definition to the system prompt describing the expected field types.",
      "Switch to tool_use with a strict JSON schema to enforce structured output at the API level.",
      "Add 2–3 few-shot examples showing correctly formatted extractions with the exact types required.",
      "Append \"Always use consistent types in your JSON output\" to the end of the user prompt."
    ],
    correct: 2,
    explanation: "<strong>C is correct.</strong> Few-shot examples are highly effective for format-consistency issues — showing the model 2–3 correctly typed outputs directly demonstrates the expected format. <strong>A</strong> helps but is less targeted for this specific problem. <strong>B</strong> enforces structure but is a larger change than needed. <strong>D</strong> is the weakest approach: vague instructions have the least effect on output format."
  },
  {
    domain: "Domain 4 — Prompt Engineering",
    text: "An agent must call a <code>log_decision</code> tool on every single turn, regardless of whether it also calls other tools. Which <code>tool_choice</code> configuration enforces this?",
    options: [
      "<code>{\"type\": \"auto\"}</code> — the model will call <code>log_decision</code> when it determines it is appropriate.",
      "<code>{\"type\": \"any\"}</code> — forces the model to call at least one tool, which will typically be <code>log_decision</code>.",
      "<code>{\"type\": \"auto\"}</code> combined with a system prompt instruction to always call <code>log_decision</code>.",
      "<code>{\"type\": \"tool\", \"name\": \"log_decision\"}</code> — forces the model to call that specific tool."
    ],
    correct: 3,
    explanation: "<strong>D is correct.</strong> Forced tool_choice (<code>type: \"tool\"</code>) makes Claude call the named tool on every turn. <strong>A</strong> allows the model to decide and may skip <code>log_decision</code>. <strong>B</strong> forces a tool call but not which tool. <strong>C</strong> is unreliable — Claude may still skip the tool despite the instruction."
  },
  {
    domain: "Domain 4 — Prompt Engineering",
    text: "A pipeline must process 10,000 independent customer records through Claude. Cost is the primary constraint and results are acceptable within 24 hours. Which approach is most appropriate?",
    options: [
      "Use the Message Batches API — approximately 50% cost reduction, asynchronous processing, results within 24 hours.",
      "Use parallel API calls with a thread pool — immediate results and lower latency than batch processing.",
      "Concatenate all 10,000 records into a single API call to eliminate per-request overhead.",
      "Use streaming API calls to reduce time-to-first-token across all records simultaneously."
    ],
    correct: 0,
    explanation: "<strong>A is correct.</strong> The Message Batches API is designed for high-volume independent tasks where cost matters and up to 24h latency is acceptable, offering ~50% cost reduction. <strong>B</strong> is faster but no cheaper. <strong>C</strong> would exceed context limits and produce unreliable results. <strong>D</strong> reduces perceived latency for interactive use but does not reduce cost."
  },
  {
    domain: "Domain 4 — Prompt Engineering",
    text: "A team uses Claude to review code that Claude generated in the same conversation session. Reviews pass consistently, but bugs slip into production. What change would most improve review quality?",
    options: [
      "Use a more capable model for the review step to improve comprehension depth.",
      "Use a separate, independent Claude instance with no shared context from the generation session.",
      "Add more detailed review criteria to the generation prompt.",
      "Run the review prompt twice in the same session to catch inconsistencies between passes."

let current = 0, score = 0, answered = false;
const domainScores = {};
questions.forEach(q => { if (!domainScores[q.domain]) domainScores[q.domain] = [0, 0]; });

function render() {
  const q = questions[current];
  document.getElementById('q-num').textContent = `Q${current + 1}`;
  document.getElementById('q-domain').textContent = q.domain;
  document.getElementById('q-text').innerHTML = q.text;
  document.getElementById('explanation').classList.remove('visible');
  document.getElementById('next-btn').classList.remove('visible');
  document.getElementById('next-btn').textContent = current === questions.length - 1 ? 'See Results →' : 'Next Question →';
  const opts = document.getElementById('options');
  opts.innerHTML = '';
  ['A','B','C','D'].forEach((letter, i) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.innerHTML = `<span class="option-letter">${letter}</span><span class="option-text">${q.options[i]}</span>`;
    div.addEventListener('click', () => selectAnswer(i));
    opts.appendChild(div);
  });
  updateProgress();
}

function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  domainScores[q.domain][1]++;
  const opts = document.getElementById('options').children;
  for (let i = 0; i < opts.length; i++) {
    opts[i].classList.add('disabled');
    if (i === q.correct) opts[i].classList.add('correct');
    else if (i === idx) opts[i].classList.add('wrong');
  }
  if (idx === q.correct) { score++; domainScores[q.domain][0]++; }
  document.getElementById('explanation-text').innerHTML = q.explanation;
  document.getElementById('explanation').classList.add('visible');
  document.getElementById('next-btn').classList.add('visible');
  document.getElementById('score-text').textContent = `Score: ${score}`;
}

function updateProgress() {
  document.getElementById('prog-fill').style.width = (current / questions.length * 100) + '%';
  document.getElementById('prog-text').textContent = `Question ${current + 1} of ${questions.length}`;
  document.getElementById('score-text').textContent = `Score: ${score}`;
}

document.getElementById('next-btn').addEventListener('click', () => {
  if (current < questions.length - 1) { current++; answered = false; render(); }
  else showScore();
});

function showScore() {
  document.getElementById('question-view').classList.add('hidden');
  document.getElementById('score-screen').classList.add('visible');
  document.getElementById('final-score').textContent = score;
  const pct = Math.round(score / questions.length * 100);
  document.getElementById('score-heading').textContent = pct >= 72 ? 'Great work!' : 'Keep practising';
  document.getElementById('score-subtext').textContent = `You scored ${score}/40 (${pct}%). CCAR-F passing threshold is 72%.`;
  document.getElementById('prog-fill').style.width = '100%';
  document.getElementById('prog-text').textContent = 'Complete';
  const rows = document.getElementById('domain-rows');
  rows.innerHTML = '';
  Object.entries(domainScores).forEach(([domain, [got, total]]) => {
    if (!total) return;
    const p = total ? got / total * 100 : 0;
    const row = document.createElement('div');
    row.className = 'domain-row';
    row.innerHTML = `<span class="domain-name">${domain}</span><div class="domain-bar-wrap"><div class="domain-bar-fill" style="width:${p}%"></div></div><span class="domain-score">${got}/${total}</span>`;
    rows.appendChild(row);
  });
}

function restart() {
  current = 0; score = 0; answered = false;
  Object.keys(domainScores).forEach(k => { domainScores[k] = [0, 0]; });
  document.getElementById('question-view').classList.remove('hidden');
  document.getElementById('score-screen').classList.remove('visible');
  render();
}

render();
</script>
