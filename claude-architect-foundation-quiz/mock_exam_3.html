<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CCAR-F Mock Exam 3 — Claude Certified Architect Foundations</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --deep-ocean: #002A41;
    --ocean: #1E5E82;
    --sky-blue: #81CCEA;
    --cloud: #EEF9FD;
    --flamingo: #D86E89;
    --white: #FFFFFF;
    --text-primary: #EEF9FD;
    --text-muted: #81CCEA;
    --surface: #0a3d57;
    --surface-raised: #0d4a6a;
    --border: #1E5E82;
    --correct-bg: #0d3d2a;
    --correct-border: #2d7a50;
    --correct-text: #6fcf97;
    --wrong-bg: #3d1522;
    --wrong-border: #a03050;
    --wrong-text: #f28b9e;
    --radius: 10px;
    --radius-sm: 6px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--deep-ocean);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 4rem;
  }

  /* ── Header ── */
  .exam-header {
    width: 100%;
    max-width: 800px;
    text-align: center;
    margin-bottom: 2rem;
  }
  .exam-badge {
    display: inline-block;
    background: var(--flamingo);
    color: var(--white);
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 0.3rem 0.8rem;
    border-radius: 20px;
    margin-bottom: 0.75rem;
  }
  .exam-title {
    font-size: 1.65rem;
    font-weight: 700;
    color: var(--white);
    line-height: 1.25;
    margin-bottom: 0.4rem;
  }
  .exam-subtitle {
    font-size: 0.9rem;
    color: var(--text-muted);
  }

  /* ── Progress ── */
  .progress-wrap {
    width: 100%;
    max-width: 800px;
    margin-bottom: 1.5rem;
  }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-size: 0.78rem;
    color: var(--text-muted);
    margin-bottom: 0.4rem;
  }
  .progress-bar-bg {
    background: var(--surface);
    border-radius: 99px;
    height: 6px;
    overflow: hidden;
  }
  .progress-bar-fill {
    background: linear-gradient(90deg, var(--sky-blue), var(--flamingo));
    height: 100%;
    border-radius: 99px;
    transition: width 0.35s ease;
    width: 0%;
  }

  /* ── Card ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem;
    width: 100%;
    max-width: 800px;
  }

  .q-meta {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 1.2rem;
    flex-wrap: wrap;
  }
  .q-num {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .domain-tag {
    font-size: 0.7rem;
    font-weight: 600;
    background: rgba(30, 94, 130, 0.4);
    color: var(--sky-blue);
    border: 1px solid var(--ocean);
    border-radius: 4px;
    padding: 0.15rem 0.5rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .q-text {
    font-size: 1.05rem;
    line-height: 1.65;
    color: var(--cloud);
    margin-bottom: 1.5rem;
    font-weight: 500;
  }

  /* ── Options ── */
  .options {
    display: flex;
    flex-direction: column;
    gap: 0.65rem;
  }
  .option-btn {
    display: flex;
    align-items: flex-start;
    gap: 0.85rem;
    background: var(--surface-raised);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.85rem 1rem;
    cursor: pointer;
    text-align: left;
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    line-height: 1.5;
    transition: border-color 0.15s, background 0.15s, transform 0.1s;
  }
  .option-btn:hover:not(:disabled) {
    border-color: var(--sky-blue);
    background: rgba(129, 206, 234, 0.07);
    transform: translateY(-1px);
  }
  .option-btn:disabled { cursor: not-allowed; }
  .option-letter {
    flex-shrink: 0;
    width: 1.6rem;
    height: 1.6rem;
    border-radius: 50%;
    background: var(--ocean);
    color: var(--white);
    font-size: 0.75rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 0.1rem;
  }
  .option-btn.correct {
    background: var(--correct-bg);
    border-color: var(--correct-border);
    color: var(--correct-text);
  }
  .option-btn.correct .option-letter {
    background: var(--correct-border);
  }
  .option-btn.wrong {
    background: var(--wrong-bg);
    border-color: var(--wrong-border);
    color: var(--wrong-text);
  }
  .option-btn.wrong .option-letter {
    background: var(--wrong-border);
  }
  .option-btn.revealed {
    background: rgba(0, 42, 65, 0.4);
    border-color: rgba(30, 94, 130, 0.5);
    color: rgba(238, 249, 253, 0.45);
  }

  /* ── Explanation ── */
  .explanation {
    display: none;
    margin-top: 1.25rem;
    border-radius: var(--radius-sm);
    overflow: hidden;
  }
  .explanation.show { display: block; }
  .explanation-header {
    background: var(--ocean);
    padding: 0.5rem 1rem;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--sky-blue);
  }
  .explanation-body {
    background: rgba(0, 42, 65, 0.6);
    border: 1px solid var(--ocean);
    border-top: none;
    padding: 1rem 1.1rem;
    font-size: 0.9rem;
    line-height: 1.65;
    color: var(--cloud);
  }
  .explanation-body strong { color: var(--sky-blue); }
  .explanation-body .wrong-note {
    margin-top: 0.85rem;
    padding-top: 0.75rem;
    border-top: 1px solid rgba(30, 94, 130, 0.4);
  }
  .wrong-note-label {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--flamingo);
    margin-bottom: 0.4rem;
  }
  .wrong-note ul {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }
  .wrong-note li {
    display: flex;
    gap: 0.5rem;
    font-size: 0.88rem;
    color: rgba(238,249,253,0.75);
  }
  .wrong-note li::before {
    content: '✗';
    color: var(--flamingo);
    flex-shrink: 0;
    font-size: 0.8rem;
    margin-top: 0.1rem;
  }

  /* ── Nav ── */
  .nav-row {
    display: flex;
    justify-content: flex-end;
    margin-top: 1.5rem;
  }
  .btn-next {
    background: var(--flamingo);
    color: var(--white);
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    padding: 0.65rem 1.5rem;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    display: none;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn-next:hover { opacity: 0.88; transform: translateY(-1px); }
  .btn-next.visible { display: inline-block; }

  /* ── Summary ── */
  #summary {
    display: none;
    width: 100%;
    max-width: 800px;
    flex-direction: column;
    gap: 1.25rem;
  }
  #summary.show { display: flex; }
  .summary-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem;
    text-align: center;
  }
  .summary-score {
    font-size: 4rem;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 0.25rem;
  }
  .summary-score.pass { color: var(--correct-text); }
  .summary-score.fail { color: var(--wrong-text); }
  .summary-label { font-size: 1rem; color: var(--text-muted); margin-bottom: 1.25rem; }
  .summary-bar-bg {
    background: var(--surface-raised);
    border-radius: 99px;
    height: 12px;
    overflow: hidden;
    margin-bottom: 0.75rem;
  }
  .summary-bar-fill {
    height: 100%;
    border-radius: 99px;
    transition: width 1s ease;
  }
  .summary-bar-fill.pass { background: linear-gradient(90deg, var(--sky-blue), var(--correct-text)); }
  .summary-bar-fill.fail { background: linear-gradient(90deg, var(--ocean), var(--flamingo)); }
  .summary-pass-note {
    font-size: 0.85rem;
    color: var(--text-muted);
  }
  .domain-breakdown {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 0.75rem;
  }
  .domain-stat {
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 1rem;
    text-align: left;
  }
  .domain-stat-name {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--text-muted);
    margin-bottom: 0.35rem;
  }
  .domain-stat-score {
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--white);
  }
  .domain-stat-pct {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 0.1rem;
  }
  .btn-restart {
    align-self: center;
    background: var(--flamingo);
    color: var(--white);
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    padding: 0.75rem 2rem;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn-restart:hover { opacity: 0.85; }
</style>
</head>
<body>

<div class="exam-header">
  <span class="exam-badge">Mock Exam 3</span>
  <h1 class="exam-title">Claude Certified Architect — Foundations</h1>
  <p class="exam-subtitle">40 Questions &nbsp;·&nbsp; All Domains &nbsp;·&nbsp; CCAR-F</p>
</div>

<div class="progress-wrap">
  <div class="progress-meta">
    <span id="progress-label">Question 1 of 40</span>
    <span id="score-live">Score: 0</span>
  </div>
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="progress-fill"></div>
  </div>
</div>

<div class="card" id="question-card"></div>

<div id="summary">
  <div class="summary-card">
    <div class="summary-score" id="summary-score"></div>
    <div class="summary-label" id="summary-label"></div>
    <div class="summary-bar-bg">
      <div class="summary-bar-fill" id="summary-bar"></div>
    </div>
    <div class="summary-pass-note" id="summary-pass-note"></div>
  </div>
  <div class="summary-card">
    <div style="font-size:0.8rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-muted);margin-bottom:1rem;">Domain Breakdown</div>
    <div class="domain-breakdown" id="domain-breakdown"></div>
  </div>
  <button class="btn-restart" onclick="restart()">Restart Exam</button>
</div>

<script>
const QUESTIONS = [
  {
    domain: "D1",
    domainLabel: "Agentic Architecture & Orchestration",
    text: "A developer is building an agentic loop and notices the model sometimes returns <code style='background:rgba(129,206,234,0.1);padding:0.1em 0.35em;border-radius:3px;font-size:0.9em;color:var(--sky-blue)'>stop_reason: \"end_turn\"</code> mid-task without calling any tools. What does this most likely indicate?",
    options: [
      "The model encountered an internal error and the loop should be restarted.",
      "The model determined it has enough information and believes the task is complete.",
      "The model's context window is full and processing stopped automatically.",
      "The PostToolUse hook blocked the final tool result from being returned."
    ],
    correct: 1,
    explanation: "<strong>\"end_turn\" means the model decided it finished.</strong> When the model has enough information and considers the task complete, it returns <code>end_turn</code> rather than issuing another tool call.",
    wrongNotes: [
      "A — Errors produce different stop reasons or exceptions, not <code>end_turn</code>.",
      "C — Context window overflow raises an error, it does not silently return <code>end_turn</code>.",
      "D — PostToolUse hooks intercept results before the model sees them but do not change a <code>tool_use</code> stop reason to <code>end_turn</code>."
    ]
  },
  {
    domain: "D1",
    domainLabel: "Agentic Architecture & Orchestration",
    text: "A team needs to build a research pipeline where a coordinator agent receives a complex query, breaks it into sub-topics, and assigns each to a specialist agent <em>concurrently</em>. What is the correct approach?",
    options: [
      "Issue multiple Task tool calls within a single coordinator response.",
      "Issue one Task tool call per coordinator response, waiting for each result before the next.",
      "Use fork_session once per subagent to create isolated parallel branches.",
      "Configure multiple allowedTools entries and call each tool sequentially."
    ],
    correct: 0,
    explanation: "<strong>Multiple Task calls in a single response triggers parallel execution.</strong> The coordinator batches all spawning decisions into one turn, and the runtime executes them concurrently.",
    wrongNotes: [
      "B — Issuing one Task call per turn with a wait produces sequential, not parallel, execution.",
      "C — fork_session is for divergent exploration from a shared baseline, not for spawning parallel task agents.",
      "D — allowedTools controls capability access, not parallelism; sequential calls are inherently sequential."
    ]
  },
  {
    domain: "D2",
    domainLabel: "Tool Design & MCP Integration",
    text: "A developer wants to add an MCP server that is only accessible during a specific project and should not appear in other Claude Code sessions. Where should the server configuration be placed?",
    options: [
      "~/.claude.json under the mcpServers key.",
      "~/.claude/CLAUDE.md as an import directive.",
      "The project root's .mcp.json file.",
      "/etc/claude/mcp.conf for system-wide MCP availability."
    ],
    correct: 2,
    explanation: "<strong>.mcp.json in the project root is project-scoped.</strong> It is only loaded when working inside that project directory.",
    wrongNotes: [
      "A — ~/.claude.json is user-scoped and makes the server available in every Claude Code session.",
      "B — CLAUDE.md is for instructions and imports, not MCP server registration.",
      "D — /etc/claude/mcp.conf does not exist; there is no system-wide MCP config path."
    ]
  },
  {
    domain: "D1",
    domainLabel: "Agentic Architecture & Orchestration",
    text: "An engineer ran a long multi-step workflow last week and wants to continue exactly where it left off without re-running completed steps. What is the correct CLI invocation?",
    options: [
      "<code>claude --fork &lt;session-id&gt;</code> to create a branch from the saved state.",
      "<code>claude --restore &lt;timestamp&gt;</code> to replay the session up to the cutoff.",
      "<code>claude --context &lt;session-name&gt;</code> to load the session into a new window.",
      "<code>claude --resume &lt;session-name&gt;</code> to continue the named session."
    ],
    correct: 3,
    explanation: "<strong><code>--resume &lt;session-name&gt;</code> continues a named session</strong> from exactly where it stopped, preserving all prior context and state.",
    wrongNotes: [
      "A — <code>--fork</code> is not a CLI flag; fork_session is an in-session API concept, not a resume mechanism.",
      "B — <code>--restore &lt;timestamp&gt;</code> does not exist.",
      "C — <code>--context</code> does not exist as a CLI flag."
    ]
  },
  {
    domain: "D3",
    domainLabel: "Claude Code Configuration & Workflows",
    text: "A monorepo has a root CLAUDE.md and a subdirectory <code>services/payments/</code> with its own CLAUDE.md. A developer is working inside <code>services/payments/</code>. Which CLAUDE.md files are active?",
    options: [
      "Both the root CLAUDE.md and services/payments/CLAUDE.md, with directory-level rules taking precedence for conflicts.",
      "Only the root CLAUDE.md, because directory-level files require explicit @import to be activated.",
      "Only services/payments/CLAUDE.md, because the most specific file overrides all parents.",
      "Neither, because CLAUDE.md files are only active when referenced via a .claude/rules/ path glob."
    ],
    correct: 0,
    explanation: "<strong>Claude Code loads CLAUDE.md files at each level of the directory hierarchy and composes them.</strong> More-specific (deeper) rules take precedence when conflicts arise.",
    wrongNotes: [
      "B — No explicit @import is needed; directory-level CLAUDE.md files are loaded automatically.",
      "C — Both are active; the deeper file does not suppress the parent.",
      "D — .claude/rules/ provides path-conditional rules, but CLAUDE.md hierarchy loading is unconditional."
    ]
  },
  {
    domain: "D1",
    domainLabel: "Agentic Architecture & Orchestration",
    text: "A compliance team needs to sanitize all file write tool results before the model processes them — stripping PII from write confirmation messages. Which hook and placement is correct?",
    options: [
      "PreToolUse hook placed before the Write tool call.",
      "PostToolUse hook intercepting the result before the model sees it.",
      "OnError hook capturing write failures and redacting the error message.",
      "PostToolUse hook appended after the model response is generated."
    ],
    correct: 1,
    explanation: "<strong>PostToolUse intercepts the tool result before the model processes it</strong> — exactly what is needed to sanitize content before the model sees it.",
    wrongNotes: [
      "A — PreToolUse runs before the tool executes; the result does not yet exist at that point.",
      "C — OnError only fires on failures, not on successful write confirmations.",
      "D — PostToolUse runs before the model processes the result, not after the model response."
    ]
  },
  {
    domain: "D2",
    domainLabel: "Tool Design & MCP Integration",
    text: "A developer is designing a generalist agent and notices it frequently selects the wrong tool when more than 30 tools are available. What is the recommended architectural fix?",
    options: [
      "Add more detailed parameter descriptions to each tool to help the model distinguish them.",
      "Set tool_choice to \"any\" to force the model to always use a tool.",
      "Reduce the tool count per agent by distributing tools across specialized subagents.",
      "Increase the number of few-shot examples in the system prompt for each tool."
    ],
    correct: 2,
    explanation: "<strong>Too many tools per agent degrades reliability.</strong> The correct fix is to distribute tools across specialized subagents so each agent has a smaller, coherent tool surface.",
    wrongNotes: [
      "A — Better descriptions help at the margin but do not fix the fundamental reliability problem at scale.",
      "B — tool_choice \"any\" forces a tool call but does not improve selection accuracy among 30+ tools.",
      "D — Adding per-tool few-shot examples would make the prompt unwieldy and likely counterproductive."
    ]
  },
  {
    domain: "D4",
    domainLabel: "Prompt Engineering & Structured Output",
    text: "A data team needs to classify 50,000 documents overnight. Cost is a primary concern and real-time results are not required. What API feature is most appropriate?",
    options: [
      "Streaming responses with an async queue to process documents sequentially at scale.",
      "Tool use with tool_choice \"any\" to force structured classification output per document.",
      "Parallel synchronous API calls using a thread pool to maximize throughput.",
      "Message Batches API, which offers 50% cost savings and supports up to 24-hour processing windows."
    ],
    correct: 3,
    explanation: "<strong>The Message Batches API is designed exactly for this case:</strong> 50% cost savings, fully asynchronous, with processing windows up to 24 hours.",
    wrongNotes: [
      "A — Streaming + async queue is more complex and does not receive the batch cost discount.",
      "B — tool_choice \"any\" addresses output format, not batch cost savings.",
      "C — Parallel sync calls do not qualify for the 50% batch discount."
    ]
  },
  {
    domain: "D1",
    domainLabel: "Agentic Architecture & Orchestration",
    text: "A coordinator agent completes a research step and then spawns a subagent to write a report. The subagent has no access to what the coordinator researched. What is the most likely cause?",
    options: [
      "Subagents do not automatically inherit coordinator context — it must be explicitly passed.",
      "The subagent's allowedTools list does not include the coordinator's output format.",
      "fork_session was not called before the Task tool, preventing context propagation.",
      "The PostToolUse hook stripped the context from the tool result before spawning."
    ],
    correct: 0,
    explanation: "<strong>Subagents do not automatically inherit coordinator context.</strong> The coordinator must explicitly pass the relevant research findings as part of the Task invocation.",
    wrongNotes: [
      "B — allowedTools controls which tools the subagent can use, not whether it receives context.",
      "C — fork_session is for divergent exploration and is unrelated to context propagation for Task subagents.",
      "D — PostToolUse affects results coming back to the coordinator, not context passed outward to new tasks."
    ]
  },
  {
    domain: "D3",
    domainLabel: "Claude Code Configuration & Workflows",
    text: "A developer wants a project-specific slash command <code>/review-pr</code> that uses an isolated sub-agent to prevent context pollution. What is the correct setup?",
    options: [
      "Add review-pr.md to ~/.claude/commands/ with context: isolated in the frontmatter.",
      "Add review-pr.md to the project's .claude/commands/ with context: fork in the SKILL.md frontmatter.",
      "Add review-pr.md to .claude/rules/ with a slash-command: true frontmatter key.",
      "Register review-pr in the project's .mcp.json as a prompt resource type."
    ],
    correct: 1,
    explanation: "<strong>Project-specific commands go in .claude/commands/; context: fork in the SKILL.md frontmatter</strong> creates an isolated sub-agent that prevents context pollution.",
    wrongNotes: [
      "A — ~/.claude/commands/ is user-scoped (applies to all projects); \"context: isolated\" is not a valid frontmatter key.",
      "C — .claude/rules/ is for path-specific conditional rules, not slash command definitions.",
      "D — .mcp.json is for MCP server registration, not slash commands."
    ]
  },
  {
    domain: "D2",
    domainLabel: "Tool Design & MCP Integration",
    text: "A file-reading tool fails because the requested file does not exist. The tool should return an error that signals to the agent it should <em>not</em> automatically retry. Which response structure is correct?",
    options: [
      "<code>{\"isError\": true, \"errorCategory\": \"transient\", \"isRetryable\": true}</code>",
      "<code>{\"isError\": true, \"errorCategory\": \"permission\", \"isRetryable\": false}</code>",
      "<code>{\"isError\": true, \"errorCategory\": \"validation\", \"isRetryable\": false}</code>",
      "Throw a runtime exception so the orchestrator's error handler can decide retry behavior."
    ],
    correct: 2,
    explanation: "<strong>\"File not found\" is a validation error — the input is invalid — and isRetryable: false</strong> signals that retrying the same path will not succeed.",
    wrongNotes: [
      "A — transient/isRetryable:true is for network blips or rate limits, not missing files.",
      "B — permission errors indicate access-denied scenarios; a non-existent file is a validation error.",
      "D — Throwing exceptions bypasses the structured error contract that agents depend on to make retry decisions."
    ]
  },
  {
    domain: "D4",
    domainLabel: "Prompt Engineering & Structured Output",
    text: "A developer uses tool_use with a JSON schema to extract data from documents. Some documents lack a publication_date field. Testing shows the model consistently hallucinates a date when none is present. What schema change fixes this?",
    options: [
      "Remove publication_date from the schema so the model never sees the field.",
      "Add an enum constraint limiting publication_date to a list of known valid dates.",
      "Set the field to required: true with a default value of \"unknown\".",
      "Mark publication_date as nullable (or not required) in the schema to allow null when absent."
    ],
    correct: 3,

      "B — The scenario describes a logic failure, not a size limit failure; batch limits are very high.",
      "C — Tool use is supported in single-turn batch requests; the limitation is specifically multi-turn interactions."
    ]
  }
];

let current = 0;
let score = 0;
let answered = false;
const domainScores = { D1: [0,0], D2: [0,0], D3: [0,0], D4: [0,0], D5: [0,0] };

function render() {
  const q = QUESTIONS[current];
  const pct = (current / QUESTIONS.length) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = `Question ${current + 1} of ${QUESTIONS.length}`;
  document.getElementById('score-live').textContent = `Score: ${score}`;

  const card = document.getElementById('question-card');
  card.innerHTML = `
    <div class="q-meta">
      <span class="q-num">Question ${current + 1}</span>
      <span class="domain-tag">${q.domain}: ${q.domainLabel}</span>
    </div>
    <div class="q-text">${q.text}</div>
    <div class="options" id="options">
      ${q.options.map((o, i) => `
        <button class="option-btn" onclick="select(${i})" id="opt-${i}">
          <span class="option-letter">${String.fromCharCode(65 + i)}</span>
          <span>${o}</span>
        </button>
      `).join('')}
    </div>
    <div class="explanation" id="explanation">
      <div class="explanation-header">Explanation</div>
      <div class="explanation-body">
        ${q.explanation}
        <div class="wrong-note">
          <div class="wrong-note-label">Why the others are wrong</div>
          <ul>${q.wrongNotes.map(n => `<li>${n}</li>`).join('')}</ul>
        </div>
      </div>
    </div>
    <div class="nav-row">
      <button class="btn-next" id="btn-next" onclick="next()">
        ${current + 1 < QUESTIONS.length ? 'Next Question →' : 'See Results'}
      </button>
    </div>
  `;
  answered = false;
}

function select(idx) {
  if (answered) return;
  answered = true;
  const q = QUESTIONS[current];
  const correct = q.correct;
  domainScores[q.domain][1]++;

  for (let i = 0; i < q.options.length; i++) {
    const btn = document.getElementById(`opt-${i}`);
    btn.disabled = true;
    if (i === correct) {
      btn.classList.add('correct');
    } else if (i === idx && i !== correct) {
      btn.classList.add('wrong');
    } else {
      btn.classList.add('revealed');
    }
  }

  if (idx === correct) {
    score++;
    domainScores[q.domain][0]++;
  }

  document.getElementById('score-live').textContent = `Score: ${score}`;
  document.getElementById('explanation').classList.add('show');
  const btnNext = document.getElementById('btn-next');
  btnNext.classList.add('visible');
}

function next() {
  current++;
  if (current >= QUESTIONS.length) {
    showSummary();
  } else {
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function showSummary() {
  document.getElementById('question-card').style.display = 'none';
  document.getElementById('progress-fill').style.width = '100%';
  document.getElementById('progress-label').textContent = 'Complete!';

  const pct = Math.round((score / QUESTIONS.length) * 100);
  const scaledScore = Math.round(100 + (score / QUESTIONS.length) * 900);
  const pass = scaledScore >= 720;
  const summary = document.getElementById('summary');
  summary.classList.add('show');

  const scoreEl = document.getElementById('summary-score');
  scoreEl.textContent = scaledScore;
  scoreEl.className = 'summary-score ' + (pass ? 'pass' : 'fail');

  document.getElementById('summary-label').textContent =
    `${score} / ${QUESTIONS.length} correct (${pct}%) — Scaled score: ${scaledScore}`;

  const bar = document.getElementById('summary-bar');
  bar.className = 'summary-bar-fill ' + (pass ? 'pass' : 'fail');
  setTimeout(() => { bar.style.width = pct + '%'; }, 100);

  document.getElementById('summary-pass-note').textContent =
    pass
      ? '✓ Above the 720 passing threshold — well done!'
      : `✗ Passing threshold is 720 (scaled). ${720 - scaledScore} points to go.`;

  const domainNames = {
    D1: 'Agentic Architecture', D2: 'Tool Design & MCP',
    D3: 'Claude Code Config', D4: 'Prompt Engineering', D5: 'Context & Reliability'
  };
  const breakdown = document.getElementById('domain-breakdown');
  breakdown.innerHTML = Object.entries(domainScores).map(([d, [got, total]]) => {
    const dpct = total > 0 ? Math.round((got / total) * 100) : 0;
    return `
      <div class="domain-stat">
        <div class="domain-stat-name">${d}: ${domainNames[d]}</div>
        <div class="domain-stat-score">${got} / ${total}</div>
        <div class="domain-stat-pct">${dpct}%</div>
      </div>
    `;
  }).join('');

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restart() {
  current = 0; score = 0; answered = false;
  Object.keys(domainScores).forEach(k => { domainScores[k] = [0, 0]; });
  document.getElementById('question-card').style.display = '';
  document.getElementById('summary').classList.remove('show');
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

render();
</script>
</body>
</html>
