<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CCAR-F Mock Exam 4 — Claude Certified Architect Foundations</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --deep-ocean: #002A41;
    --ocean: #1E5E82;
    --sky-blue: #81CCEA;
    --cloud: #EEF9FD;
    --flamingo: #D86E89;
    --white: #FFFFFF;
    --text-primary: #EEF9FD;
    --text-muted: #81CCEA;
    --surface: #0a3d57;
    --surface-raised: #0d4a6a;
    --border: #1E5E82;
    --correct-bg: #0d3d2a;
    --correct-border: #2d7a50;
    --correct-text: #6fcf97;
    --wrong-bg: #3d1522;
    --wrong-border: #a03050;
    --wrong-text: #f28b9e;
    --radius: 10px;
    --radius-sm: 6px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--deep-ocean);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 4rem;
  }
  .exam-header { width: 100%; max-width: 800px; text-align: center; margin-bottom: 2rem; }
  .exam-badge {
    display: inline-block;
    background: var(--flamingo);
    color: var(--white);
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 0.3rem 0.8rem;
    border-radius: 20px;
    margin-bottom: 0.75rem;
  }
  .exam-title { font-size: 1.65rem; font-weight: 700; color: var(--white); line-height: 1.25; margin-bottom: 0.4rem; }
  .exam-subtitle { font-size: 0.9rem; color: var(--text-muted); }
  .progress-wrap { width: 100%; max-width: 800px; margin-bottom: 1.5rem; }
  .progress-meta { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--text-muted); margin-bottom: 0.4rem; }
  .progress-bar-bg { background: var(--surface); border-radius: 99px; height: 6px; overflow: hidden; }
  .progress-bar-fill {
    background: linear-gradient(90deg, var(--sky-blue), var(--flamingo));
    height: 100%; border-radius: 99px;
    transition: width 0.35s ease; width: 0%;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem;
    width: 100%; max-width: 800px;
  }
  .q-meta { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 1.2rem; flex-wrap: wrap; }
  .q-num { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .domain-tag {
    font-size: 0.7rem; font-weight: 600;
    background: rgba(30, 94, 130, 0.4); color: var(--sky-blue);
    border: 1px solid var(--ocean); border-radius: 4px;
    padding: 0.15rem 0.5rem; letter-spacing: 0.04em; text-transform: uppercase;
  }
  .q-text { font-size: 1.05rem; line-height: 1.65; color: var(--cloud); margin-bottom: 1.5rem; font-weight: 500; }
  .options { display: flex; flex-direction: column; gap: 0.65rem; }
  .option-btn {
    display: flex; align-items: flex-start; gap: 0.85rem;
    background: var(--surface-raised);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.85rem 1rem;
    cursor: pointer; text-align: left;
    color: var(--text-primary); font-family: 'Inter', sans-serif;
    font-size: 0.95rem; line-height: 1.5;
    transition: border-color 0.15s, background 0.15s, transform 0.1s;
  }
  .option-btn:hover:not(:disabled) { border-color: var(--sky-blue); background: rgba(129,206,234,0.07); transform: translateY(-1px); }
  .option-btn:disabled { cursor: not-allowed; }
  .option-letter {
    flex-shrink: 0; width: 1.6rem; height: 1.6rem; border-radius: 50%;
    background: var(--ocean); color: var(--white);
    font-size: 0.75rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center; margin-top: 0.1rem;
  }
  .option-btn.correct { background: var(--correct-bg); border-color: var(--correct-border); color: var(--correct-text); }
  .option-btn.correct .option-letter { background: var(--correct-border); }
  .option-btn.wrong { background: var(--wrong-bg); border-color: var(--wrong-border); color: var(--wrong-text); }
  .option-btn.wrong .option-letter { background: var(--wrong-border); }
  .option-btn.revealed { background: rgba(0,42,65,0.4); border-color: rgba(30,94,130,0.5); color: rgba(238,249,253,0.45); }
  .explanation { display: none; margin-top: 1.25rem; border-radius: var(--radius-sm); overflow: hidden; }
  .explanation.show { display: block; }
  .explanation-header { background: var(--ocean); padding: 0.5rem 1rem; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--sky-blue); }
  .explanation-body { background: rgba(0,42,65,0.6); border: 1px solid var(--ocean); border-top: none; padding: 1rem 1.1rem; font-size: 0.9rem; line-height: 1.65; color: var(--cloud); }
  .explanation-body strong { color: var(--sky-blue); }
  .wrong-note { margin-top: 0.85rem; padding-top: 0.75rem; border-top: 1px solid rgba(30,94,130,0.4); }
  .wrong-note-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--flamingo); margin-bottom: 0.4rem; }
  .wrong-note ul { list-style: none; display: flex; flex-direction: column; gap: 0.3rem; }
  .wrong-note li { display: flex; gap: 0.5rem; font-size: 0.88rem; color: rgba(238,249,253,0.75); }
  .wrong-note li::before { content: '✗'; color: var(--flamingo); flex-shrink: 0; font-size: 0.8rem; margin-top: 0.1rem; }
  .nav-row { display: flex; justify-content: flex-end; margin-top: 1.5rem; }
  .btn-next {
    background: var(--flamingo); color: var(--white);
    font-family: 'Inter', sans-serif; font-size: 0.9rem; font-weight: 600;
    padding: 0.65rem 1.5rem; border: none; border-radius: var(--radius-sm);
    cursor: pointer; display: none;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn-next:hover { opacity: 0.88; transform: translateY(-1px); }
  .btn-next.visible { display: inline-block; }
  #summary { display: none; width: 100%; max-width: 800px; flex-direction: column; gap: 1.25rem; }
  #summary.show { display: flex; }
  .summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem; text-align: center; }
  .summary-score { font-size: 4rem; font-weight: 700; line-height: 1; margin-bottom: 0.25rem; }
  .summary-score.pass { color: var(--correct-text); }
  .summary-score.fail { color: var(--wrong-text); }
  .summary-label { font-size: 1rem; color: var(--text-muted); margin-bottom: 1.25rem; }
  .summary-bar-bg { background: var(--surface-raised); border-radius: 99px; height: 12px; overflow: hidden; margin-bottom: 0.75rem; }
  .summary-bar-fill { height: 100%; border-radius: 99px; transition: width 1s ease; }
  .summary-bar-fill.pass { background: linear-gradient(90deg, var(--sky-blue), var(--correct-text)); }
  .summary-bar-fill.fail { background: linear-gradient(90deg, var(--ocean), var(--flamingo)); }
  .summary-pass-note { font-size: 0.85rem; color: var(--text-muted); }
  .domain-breakdown { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0.75rem; }
  .domain-stat { background: var(--surface-raised); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 1rem; text-align: left; }
  .domain-stat-name { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted); margin-bottom: 0.35rem; }
  .domain-stat-score { font-size: 1.4rem; font-weight: 700; color: var(--white); }
  .domain-stat-pct { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.1rem; }
  .btn-restart {
    align-self: center; background: var(--flamingo); color: var(--white);
    font-family: 'Inter', sans-serif; font-size: 0.9rem; font-weight: 600;
    padding: 0.75rem 2rem; border: none; border-radius: var(--radius-sm);
    cursor: pointer; transition: opacity 0.15s;
  }
  .btn-restart:hover { opacity: 0.85; }
  code { background: rgba(129,206,234,0.1); padding: 0.1em 0.35em; border-radius: 3px; font-size: 0.9em; color: var(--sky-blue); }
</style>
</head>

<script>
const QUESTIONS = [
  // Q1 D1 C
  {
    domain:"D1", domainLabel:"Agentic Architecture & Orchestration",
    text:"A coordinator spawns a subagent to perform a database cleanup task. The subagent needs to know the database connection string and the list of stale record IDs. When should this data be passed to the subagent?",
    options:[
      "After the subagent starts, via a PostToolUse hook that appends context to the initial response.",
      "Via a shared global environment variable that both the coordinator and subagent can read.",
      "As explicit parameters in the Task tool call that spawns the subagent.",
      "Via the CLAUDE.md file, which the subagent reads automatically on startup."
    ],
    correct:2,
    explanation:"<strong>Context must be explicitly passed in the Task tool call — subagents do not inherit coordinator context automatically.</strong> The coordinator includes all required data in the spawning invocation.",
    wrongNotes:[
      "A — PostToolUse fires after a tool returns a result, not during the spawning of a new subagent.",
      "B — Global env vars are not a pattern for passing dynamic, per-task runtime context.",
      "D — CLAUDE.md carries static instructions, not dynamic runtime data like connection strings."
    ]
  },
  // Q2 D2 D
  {
    domain:"D2", domainLabel:"Tool Design & MCP Integration",
    text:"A payment processing tool attempts a charge and receives an \"insufficient funds\" response from the bank. How should the tool classify this error?",
    options:[
      "<code>{\"isError\": true, \"errorCategory\": \"transient\", \"isRetryable\": true}</code> — insufficient funds may clear on retry.",
      "<code>{\"isError\": true, \"errorCategory\": \"permission\", \"isRetryable\": false}</code> — the customer is not authorized.",
      "<code>{\"isError\": true, \"errorCategory\": \"validation\", \"isRetryable\": false}</code> — the payment amount is invalid.",
      "<code>{\"isError\": true, \"errorCategory\": \"business\", \"isRetryable\": false}</code> — a domain rule prevents the operation."
    ],
    correct:3,
    explanation:"<strong>Insufficient funds is a business rule violation</strong> — a well-formed, technically valid request that the domain rules reject. isRetryable: false because retrying the same charge won't change the outcome.",
    wrongNotes:[
      "A — transient/retryable is for infrastructure failures (network timeouts, rate limits), not domain rejections.",
      "B — permission errors are for authentication or authorization failures, not balance checks.",
      "C — validation errors are for malformed or syntactically invalid inputs, not domain rejections."
    ]
  },
  // Q3 D1 A
  {
    domain:"D1", domainLabel:"Agentic Architecture & Orchestration",
    text:"An agentic loop calls a tool and receives the result. Before looping back to the model, the developer accidentally sends the next request without appending the tool result to the conversation history. What is the most likely consequence?",
    options:[
      "The model will not know the tool was called or what it returned, leading to repeated tool calls or hallucinated results.",
      "The model automatically re-fetches the tool result from its internal result cache.",
      "The model returns <code>stop_reason: \"error\"</code> indicating that context is missing.",
      "The loop continues correctly because the model infers prior tool usage from surrounding context."
    ],
    correct:0,
    explanation:"<strong>Tool results must be appended to the conversation before the next model call.</strong> Without this, the model has no record of the tool or its result and will repeat the call or fabricate an answer.",
    wrongNotes:[
      "B — No internal result cache exists; the model only sees what is in the conversation history.",
      "C — Missing tool results do not produce a special error stop_reason.",
      "D — The model does not infer tool results from surrounding text; it relies on the explicit message history."
    ]
  },
  // Q4 D3 B
  {
    domain:"D3", domainLabel:"Claude Code Configuration & Workflows",
    text:"A custom slash command <code>/audit-db</code> needs access to a <code>db_query</code> MCP tool but must not be able to write files or run shell commands. How is this restriction configured?",
    options:[
      "Add a <code>deny-tools: [\"Write\", \"Bash\"]</code> entry to the SKILL.md frontmatter.",
      "Add an <code>allowed-tools: [\"db_query\"]</code> entry to the SKILL.md frontmatter.",
      "Set <code>tool_choice: \"forced\"</code> to the db_query tool in the system prompt.",
      "List prohibited tools in the CLAUDE.md @import file."
    ],
    correct:1,
    explanation:"<strong>allowed-tools in SKILL.md frontmatter</strong> restricts which tools the skill's sub-agent can access — an explicit allowlist. Anything not listed is unavailable.",
    wrongNotes:[
      "A — deny-tools is not a valid SKILL.md frontmatter key.",
      "C — tool_choice is an API parameter set per-call, not a SKILL.md config key.",
      "D — CLAUDE.md does not support tool restriction syntax."
    ]
  },
  // Q5 D1 C
  {
    domain:"D1", domainLabel:"Agentic Architecture & Orchestration",
    text:"A coordinator breaks a legal document into sections and spawns specialist subagents to review each section independently. Which property of the Task invocation ensures each specialist receives only its relevant section?",
    options:[
      "The coordinator sets <code>allowedTools: []</code> on each subagent to prevent it from reading other sections.",
      "The coordinator uses fork_session so each subagent has an isolated context by default.",
      "The coordinator includes only the relevant section content in each Task tool call's prompt.",
      "Claude's automatic content partitioning feature separates input by subagent type."
    ],
    correct:2,
    explanation:"<strong>The coordinator controls each subagent's input by including only the relevant section in the Task prompt.</strong> What the subagent sees is exactly what the coordinator passes.",
    wrongNotes:[
      "A — allowedTools:[] would prevent the subagent from using any tools, not limit what it receives as input.",
      "B — fork_session creates divergent explorations from a shared baseline; it does not partition input content.",
      "D — No such automatic content partitioning feature exists."
    ]
  },
  // Q6 D4 D
  {
    domain:"D4", domainLabel:"Prompt Engineering & Structured Output",
    text:"A developer is choosing between using tool_use with a JSON schema versus prompting Claude to output raw JSON in the response text. What is the primary advantage of the tool_use + schema approach?",
    options:[
      "Tool use is faster because it skips the text generation step entirely.",
      "Tool use automatically validates the output against the schema on the client side.",
      "Tool use enables multi-turn conversations while JSON text mode does not.",
      "Tool use with a JSON schema constrains the model's output structure, reducing hallucination of extra or absent fields."
    ],
    correct:3,
    explanation:"<strong>Tool use + JSON schema gives the model an explicit structure to follow</strong>, significantly reducing hallucinated or extraneous fields compared to free-form JSON text output.",
    wrongNotes:[
      "A — Tool use does not skip generation; the model still generates the structured content.",
      "B — Client-side validation is a developer choice; it is not automatically provided by the API.",
      "C — Multi-turn conversations work with both approaches equally."
    ]
  },
  // Q7 D1 A
  {
    domain:"D1", domainLabel:"Agentic Architecture & Orchestration",
    text:"Agent A completes a data analysis step and must hand off results to Agent B for visualization. What is the recommended format for this structured handoff?",
    options:[
      "A structured object containing the analysis results, metadata about what was computed, and any data quality caveats.",
      "A plain English summary of findings that Agent B can interpret naturally.",
      "A fork_session call so Agent B inherits Agent A's full conversation history.",
      "A PostToolUse hook that copies Agent A's context into Agent B's input buffer."
    ],
    correct:0,
    explanation:"<strong>Structured handoffs should include results, metadata, and caveats</strong> — giving the receiving agent everything it needs to proceed without guessing or re-doing work.",
    wrongNotes:[
      "B — Plain English is ambiguous and error-prone for programmatic agent-to-agent handoffs.",
      "C — fork_session is for divergent exploration from a shared baseline, not structured handoffs.",
      "D — PostToolUse fires on tool results; it is not a mechanism for agent-to-agent handoffs."
    ]
  },
  // Q8 D2 B
  {
    domain:"D2", domainLabel:"Tool Design & MCP Integration",
    text:"An MCP server configuration in .mcp.json needs to pass a secret API key. The key must not be hardcoded in the config file. What is the correct approach?",
    options:[
      "Store the key in CLAUDE.md and reference it with @import.",
      "Use environment variable expansion syntax (e.g., <code>${MY_API_KEY}</code>) in the .mcp.json config.",
      "Pass the key as a tool parameter on each individual MCP tool call.",
      "Encrypt the key using Claude's built-in secret management before writing it to .mcp.json."
    ],
    correct:1,
    explanation:"<strong>.mcp.json supports environment variable expansion (<code>${VAR_NAME}</code>)</strong>, keeping secrets out of the committed config file while still making them available at runtime.",
    wrongNotes:[
      "A — CLAUDE.md is for instructions; it is not a secrets management facility.",
      "C — Passing a secret as a tool parameter exposes it in every call and in the conversation history.",
      "D — Claude has no built-in secret management or encryption for config files."
    ]
  },
  // Q9 D1 C
  {
    domain:"D1", domainLabel:"Agentic Architecture & Orchestration",
    text:"A developer builds a pipeline: step 1 drafts a report, step 2 reviews it, step 3 formats it. Each step's output is the next step's input, and the sequence never changes. What is this decomposition pattern called?",
    options:[
      "Dynamic adaptive decomposition.",
      "Hub-and-spoke orchestration.",
      "Prompt chaining.",
      "Fork-and-join parallelism."
    ],
    correct:2,
    explanation:"<strong>A fixed sequence where each step's output feeds the next is prompt chaining.</strong> The pipeline is predetermined and does not adapt based on content.",
    wrongNotes:[
      "A — Dynamic adaptive decomposition decides steps at runtime based on the input's characteristics.",
      "B — Hub-and-spoke has a central coordinator routing tasks to various specialist agents.",
      "D — Fork-and-join involves parallel branches that execute concurrently and then merge."
    ]
  },
  // Q10 D3 D
  {
    domain:"D3", domainLabel:"Claude Code Configuration & Workflows",
    text:"A developer wants a personal rule that applies to every project they work on: \"always use British English spelling.\" Where should this be placed?",
    options:[
      "In each project's root CLAUDE.md.",
      "In .claude/rules/ with <code>paths: [\"**/*\"]</code> to match all files.",
      "In the project's .mcp.json as an instruction resource.",
      "In <code>~/.claude/CLAUDE.md</code> (the user-level global file)."
    ],
    correct:3,
    explanation:"<strong>~/.claude/CLAUDE.md is the user-level global configuration</strong> that applies across all projects — the correct location for universal personal preferences.",
    wrongNotes:[
      "A — Project-level CLAUDE.md would need to be duplicated in every project.",
      "B — .claude/rules/ is project-scoped; it does not persist across other projects.",
      "C — .mcp.json is for MCP server configuration, not behavioral instructions."
    ]
  },
  // Q11 D4 A
  {
    domain:"D4", domainLabel:"Prompt Engineering & Structured Output",
    text:"A medical triage agent escalates cases with confidence > 0.85 but is missing cases that doctors later classify as clearly urgent. What adjustment reduces these false negatives?",
    options:[
      "Define explicit symptom-based categorical criteria (e.g., chest pain + shortness of breath = escalate) rather than relying on a confidence threshold.",
      "Lower the confidence threshold to 0.6 to escalate more cases.",
      "Add more few-shot examples of non-urgent cases to sharpen the threshold.",
      "Use tool_choice \"any\" to force the model to always output an escalation decision."
    ],
    correct:0,
    explanation:"<strong>Explicit categorical criteria encode domain knowledge that confidence thresholds cannot capture</strong> — specifying exactly which symptom combinations warrant escalation.",
    wrongNotes:[
      "B — Lowering the threshold increases false positives and may not catch the specific missed patterns.",
      "C — More non-urgent examples sharpen what not to escalate; they don't identify what to catch.",
      "D — tool_choice \"any\" forces a decision output but does not improve the classification logic."
    ]
  },
  // Q12 D2 B
  {
    domain:"D2", domainLabel:"Tool Design & MCP Integration",
    text:"An agent must always call the <code>validate_data</code> tool as the first action in every pipeline run, regardless of user input. Which configuration enforces this?",
    options:[
      "Set tool_choice: \"any\" so the model must call some tool.",
      "Set tool_choice to the specific tool name <code>\"validate_data\"</code> to force that exact call.",
      "List validate_data first in the tools array so the model prioritizes it.",
      "Add a PreToolUse hook that redirects all tool calls to validate_data."
    ],
    correct:1,
    explanation:"<strong>Setting tool_choice to the specific tool name forces the model to call exactly that tool</strong> — no other tool can be selected.",
    wrongNotes:[
      "A — tool_choice \"any\" forces a tool call but allows the model to choose which tool.",
      "C — Array ordering in the tools list does not control selection priority.",
      "D — PreToolUse hooks intercept calls after the model has already decided to call them; they do not redirect."
    ]
  },
  // Q13 D1 C
  {
    domain:"D1", domainLabel:"Agentic Architecture & Orchestration",
    text:"An agent resumes a session from two weeks ago. The context contains file paths and function names. The agent immediately begins modifying code based on this stored context without re-reading the files. What is the primary risk?",
    options:[
      "The --resume flag will detect stale context and automatically prompt a refresh.",
      "The model's knowledge cutoff will compensate for any code changes made since the session.",
      "The session context may be stale — files and function signatures may have changed since the session was saved.",
      "Stale context only affects tool call parameters, not the quality of code generation."
    ],
    correct:2,
    explanation:"<strong>Stored session context reflects the codebase as it was when the session was created.</strong> Two-week-old paths and function names may no longer exist. The agent should re-read relevant files before acting.",
    wrongNotes:[
      "A — --resume loads the session as-is; there is no automatic staleness detection.",
      "B — The model's knowledge cutoff relates to training data, not the live state of files on disk.",
      "D — Stale context affects any generation that depends on it, not just tool call parameters."
    ]
  },
  // Q14 D3 D
  {
    domain:"D3", domainLabel:"Claude Code Configuration & Workflows",
    text:"A developer is refining a prompt that generates SQL queries. They have a test suite of 50 input/expected-output pairs. What is the most systematic iterative refinement approach?",
    options:[
      "Run the prompt once, review all 50 outputs manually, then rewrite the prompt entirely.",
      "Use Message Batches to run the prompt 100 times and select the most common output.",
      "Adjust model temperature until 90% of queries pass the test suite.",
      "Run the test suite, identify failing cases, add targeted examples for those failure patterns, re-run, and repeat."
    ],
    correct:3,
    explanation:"<strong>Test-driven iteration</strong> — run the suite, identify specific failures, add targeted examples for those patterns, then re-run — is the systematic approach for prompt refinement.",
    wrongNotes:[
      "A — Full manual review then a complete rewrite discards information about what is already working.",
      "B — Running 100 times and selecting the most common output is not prompt refinement.",
      "C — Temperature tuning addresses output variability, not structural prompt deficiencies."
    ]
  },
  // Q15 D4 A
  {
    domain:"D4", domainLabel:"Prompt Engineering & Structured Output",

    <div class="q-meta">
      <span class="q-num">Question ${current + 1}</span>
      <span class="domain-tag">${q.domain}: ${q.domainLabel}</span>
    </div>
    <div class="q-text">${q.text}</div>
    <div class="options" id="options">
      ${q.options.map((o,i) => `
        <button class="option-btn" onclick="select(${i})" id="opt-${i}">
          <span class="option-letter">${String.fromCharCode(65+i)}</span>
          <span>${o}</span>
        </button>`).join('')}
    </div>
    <div class="explanation" id="explanation">
      <div class="explanation-header">Explanation</div>
      <div class="explanation-body">
        ${q.explanation}
        <div class="wrong-note">
          <div class="wrong-note-label">Why the others are wrong</div>
          <ul>${q.wrongNotes.map(n => `<li>${n}</li>`).join('')}</ul>
        </div>
      </div>
    </div>
    <div class="nav-row">
      <button class="btn-next" id="btn-next" onclick="next()">
        ${current + 1 < QUESTIONS.length ? 'Next Question →' : 'See Results'}
      </button>
    </div>`;
  answered = false;
}

function select(idx) {
  if (answered) return;
  answered = true;
  const q = QUESTIONS[current];
  domainScores[q.domain][1]++;
  for (let i = 0; i < q.options.length; i++) {
    const btn = document.getElementById(`opt-${i}`);
    btn.disabled = true;
    if (i === q.correct) btn.classList.add('correct');
    else if (i === idx) btn.classList.add('wrong');
    else btn.classList.add('revealed');
  }
  if (idx === q.correct) { score++; domainScores[q.domain][0]++; }
  document.getElementById('score-live').textContent = `Score: ${score}`;
  document.getElementById('explanation').classList.add('show');
  document.getElementById('btn-next').classList.add('visible');
}

function next() {
  current++;
  if (current >= QUESTIONS.length) { showSummary(); } else { render(); window.scrollTo({top:0,behavior:'smooth'}); }
}

function showSummary() {
  document.getElementById('question-card').style.display = 'none';
  document.getElementById('progress-fill').style.width = '100%';
  document.getElementById('progress-label').textContent = 'Complete!';
  const pct = Math.round(score / QUESTIONS.length * 100);
  const scaled = Math.round(100 + score / QUESTIONS.length * 900);
  const pass = scaled >= 720;
  document.getElementById('summary').classList.add('show');
  const scoreEl = document.getElementById('summary-score');
  scoreEl.textContent = scaled;
  scoreEl.className = 'summary-score ' + (pass ? 'pass' : 'fail');
  document.getElementById('summary-label').textContent = `${score} / ${QUESTIONS.length} correct (${pct}%) — Scaled score: ${scaled}`;
  const bar = document.getElementById('summary-bar');
  bar.className = 'summary-bar-fill ' + (pass ? 'pass' : 'fail');
  setTimeout(() => { bar.style.width = pct + '%'; }, 100);
  document.getElementById('summary-pass-note').textContent = pass
    ? '✓ Above the 720 passing threshold — well done!'
    : `✗ Passing threshold is 720 (scaled). ${720 - scaled} points to go.`;
  const names = { D1:'Agentic Architecture', D2:'Tool Design & MCP', D3:'Claude Code Config', D4:'Prompt Engineering', D5:'Context & Reliability' };
  document.getElementById('domain-breakdown').innerHTML = Object.entries(domainScores).map(([d,[g,t]]) => `
    <div class="domain-stat">
      <div class="domain-stat-name">${d}: ${names[d]}</div>
      <div class="domain-stat-score">${g} / ${t}</div>
      <div class="domain-stat-pct">${t > 0 ? Math.round(g/t*100) : 0}%</div>
    </div>`).join('');
  window.scrollTo({top:0,behavior:'smooth'});
}

function restart() {
  current = 0; score = 0; answered = false;
  Object.keys(domainScores).forEach(k => { domainScores[k] = [0,0]; });
  document.getElementById('question-card').style.display = '';
  document.getElementById('summary').classList.remove('show');
  render(); window.scrollTo({top:0,behavior:'smooth'});
}

render();
</script>
</body>
</html>
