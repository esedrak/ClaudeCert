<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Architect Foundations – Practice Quiz</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #232637;
      --border: #2e3247;
      --accent: #7c6ff7;
      --accent-dim: #5a54c4;
      --text: #e4e6f0;
      --text-muted: #8b90a8;
      --correct: #3ecf8e;
      --wrong: #f06a6a;
      --warn: #f5a623;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem;
      line-height: 1.6;
    }

    h1 {
      text-align: center;
      font-size: 1.7rem;
      font-weight: 700;
      margin-bottom: 0.3rem;
      color: var(--accent);
      letter-spacing: -0.02em;
    }

    .subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    /* ── Scoreboard ── */
    #scoreboard {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .score-pill {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.4rem 1.2rem;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .score-pill span { font-weight: 700; }
    .pill-correct span { color: var(--correct); }
    .pill-wrong span { color: var(--wrong); }
    .pill-remaining span { color: var(--warn); }

    /* Progress bar */
    #progress-wrap {
      max-width: 780px;
      margin: 0 auto 2rem;
    }
    #progress-bar-bg {
      background: var(--surface);
      border-radius: 999px;
      height: 6px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    #progress-bar {
      height: 100%;
      background: var(--accent);
      transition: width 0.4s ease;
      border-radius: 999px;
    }
    #progress-label {
      text-align: right;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 0.3rem;
    }

    /* ── Question card ── */
    #quiz-container {
      max-width: 780px;
      margin: 0 auto;
    }

    .question-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.8rem;
      margin-bottom: 1.5rem;
      transition: opacity 0.3s;
    }

    .question-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.6rem;
    }

    .q-number {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
    }

    .q-scenario {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-style: italic;
    }

    .question-text {
      font-size: 1.05rem;
      font-weight: 500;
      margin-bottom: 1.2rem;
      color: var(--text);
    }

    /* Options */
    .options { display: flex; flex-direction: column; gap: 0.6rem; }

    .option-btn {
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      cursor: pointer;
      text-align: left;
      font-size: 0.95rem;
      color: var(--text);
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: #252840;
      transform: translateX(2px);
    }

    .option-letter {
      font-weight: 700;
      min-width: 1.4rem;
      color: var(--accent);
    }

    .option-btn.correct {
      border-color: var(--correct);
      background: rgba(62, 207, 142, 0.08);
    }

    .option-btn.wrong {
      border-color: var(--wrong);
      background: rgba(240, 106, 106, 0.08);
    }

    .option-btn.correct .option-letter { color: var(--correct); }
    .option-btn.wrong .option-letter { color: var(--wrong); }

    .option-btn:disabled { cursor: default; }

    /* Explanation */
    .explanation {
      display: none;
      margin-top: 1.2rem;
      border-top: 1px solid var(--border);
      padding-top: 1.2rem;
    }

    .explanation.show { display: block; }

    .explanation-header {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.5rem;
    }

    .explanation-header.correct-hdr { color: var(--correct); }
    .explanation-header.wrong-hdr { color: var(--wrong); }

    .explanation-body {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 0.8rem;
      line-height: 1.6;
    }

    .takeaway {
      background: var(--bg);
      border-left: 3px solid var(--accent);
      padding: 0.6rem 0.9rem;
      border-radius: 0 6px 6px 0;
      font-size: 0.88rem;
      color: var(--text);
    }

    .takeaway-label {
      font-weight: 700;
      color: var(--accent);
      margin-right: 0.3rem;
    }

    .next-btn {
      margin-top: 1rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.6rem 1.4rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .next-btn:hover { background: var(--accent-dim); transform: translateY(-1px); }

    /* ── Results page ── */
    #results {
      display: none;
      max-width: 780px;
      margin: 0 auto;
    }

    .results-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem;
      text-align: center;
      margin-bottom: 2rem;
    }

    .results-card h2 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
    }

    .score-big {
      font-size: 4rem;
      font-weight: 800;
      line-height: 1;
      margin: 1rem 0 0.3rem;
    }

    .score-label { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.2rem; }

    .grade-bar {
      height: 10px;
      background: var(--surface2);
      border-radius: 999px;
      overflow: hidden;
      margin: 0.8rem auto;
      max-width: 300px;
    }

    .grade-bar-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--correct);
    }

    .results-stats {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }

    .stat-box {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.8rem 1.4rem;
    }

    .stat-val { font-size: 1.8rem; font-weight: 800; }
    .stat-lbl { font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .stat-correct .stat-val { color: var(--correct); }
    .stat-wrong .stat-val { color: var(--wrong); }

    /* Review list */
    .review-section h3 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    .review-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.2rem;
      margin-bottom: 1rem;
    }

    .review-item.correct-item { border-left: 3px solid var(--correct); }
    .review-item.wrong-item { border-left: 3px solid var(--wrong); }

    .review-q {
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .review-answer {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .review-answer strong { color: var(--text); }

    .restart-btn {
      display: block;
      margin: 2rem auto 0;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.85rem 2rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }

    .restart-btn:hover { background: var(--accent-dim); }

    /* Navigation dots */
    #nav-dots {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      max-width: 780px;
      margin: 0 auto 2rem;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--surface2);
      border: 1px solid var(--border);
      cursor: default;
    }

    .dot.answered-correct { background: var(--correct); border-color: var(--correct); }
    .dot.answered-wrong { background: var(--wrong); border-color: var(--wrong); }
    .dot.current { background: var(--accent); border-color: var(--accent); }
  </style>
</head>
<body>

<h1>Claude Architect Foundations</h1>
<p class="subtitle">Practice Quiz — 33 questions</p>

<div id="scoreboard">
  <div class="score-pill pill-correct">Correct: <span id="score-correct">0</span></div>
  <div class="score-pill pill-wrong">Wrong: <span id="score-wrong">0</span></div>
  <div class="score-pill pill-remaining">Remaining: <span id="score-remaining">33</span></div>
</div>

<div id="progress-wrap">
  <div id="progress-bar-bg"><div id="progress-bar" style="width:0%"></div></div>
  <div id="progress-label">0 / 33</div>
</div>

<div id="nav-dots"></div>

<div id="quiz-container"></div>
<div id="results"></div>

<script>
const questions = [
  {
    scenario: "Schema Design & Self-Correction",
    question: "An automated invoice extraction pipeline occasionally outputs structured JSON where the extracted line items do not add up to the total amount extracted from the invoice. What is the best architectural approach to handle this semantic error?",
    options: [
      "Add a `calculated_total` field alongside the `stated_total` field, compare them, and flag mismatches for human review.",
      "Automatically adjust the line item values so they mathematically sum to the stated total.",
      "Introduce a secondary LLM step to reconcile the math errors.",
      "Add more few-shot examples of correct math to the prompt."
    ],
    correct: 0,
    why: "JSON schemas prevent syntax errors but not semantic errors (like bad math). The most robust self-correction pattern is extracting both what the document explicitly states (stated_total) and what the model calculates from the line items (calculated_total). If they don't match, the record is flagged for human review. This improves reliability without fabricating data.",
    takeaway: "Design self-correction flows by extracting both a stated value and a calculated value, routing mismatches to human review rather than silently \"fixing\" source document errors."
  },
  {
    scenario: "Batch Processing & Cost Optimization",
    question: "You are preparing to process 50,000 legacy documents using the Batch API. An initial test on 500 documents reveals that 18% of them require 2-3 prompt refinements to extract data correctly. What is the most cost-efficient strategy for scaling this workload?",
    options: [
      "Refine the prompt interactively on a representative sample to maximize first-pass success, then process all 50,000 documents via the Batch API.",
      "Use the Batch API to process all 50,000 documents immediately, identify failures at scale, and resubmit them.",
      "Process the 50,000 documents using the synchronous API to handle prompt refinement dynamically per document.",
      "Begin submitting 5,000-document batches to incrementally learn failure modes in production."
    ],
    correct: 0,
    why: "The guide explicitly recommends refining prompts on a representative sample before batch-processing large volumes. Iterative resubmissions at scale destroy the cost savings of the Batch API. By fixing the failure modes on a localized sample, you ensure the prompt is robust, maximizing first-pass success when you finally trigger the 50,000-document Batch run.",
    takeaway: "Refine prompts on a representative sample first to maximize first-pass success, then run the full volume through the Batch API to minimize expensive resubmissions."
  },
  {
    scenario: "SLA Management & Async APIs",
    question: "Your system processes asynchronous user requests with a strict Service Level Agreement (SLA) requiring results within 30 hours of submission. You plan to use the Message Batches API, which can take up to 24 hours to complete. Which batch submission schedule best meets the SLA while maximizing cost efficiency?",
    options: [
      "Submit batches every 6 hours.",
      "Submit one large batch at the end of each day.",
      "Use the synchronous API instead to guarantee the SLA.",
      "Submit batches every 4 hours."
    ],
    correct: 3,
    why: "Worst-case total turnaround time is the time a document waits for the next batch window plus the maximum batch processing time (24 hours). If you submit every 4 hours, a document arriving right after a cutoff waits 4 hours + 24 hours processing = 28 hours. This leaves a 2-hour safety buffer under the 30-hour SLA.",
    takeaway: "Calculate worst-case SLA by adding batch frequency interval to the 24-hour max processing time; always leave an operational buffer."
  },
  {
    scenario: "Schema Engineering & Provenance",
    question: "An extraction pipeline processes technical manuals. A specific manual lists two conflicting battery capacities: one in the text and a different one in a detailed specs table. Historical data shows the specs table is correct 90% of the time. How should the extraction schema handle this?",
    options: [
      "Halt processing and flag the document for manual correction before extraction.",
      "Use a single-value schema and prompt the model to pick the most likely correct value.",
      "Hard-code a rule to always extract the value from the specs table.",
      "Change the field to capture all conflicting values along with their source locations to preserve provenance for downstream reconciliation."
    ],
    correct: 3,
    why: "Forcing premature collapse into a single value is an anti-pattern. If the specs table is only right 90% of the time, hard-coding a preference guarantees a 10% error rate. Modifying the schema to accept an array of values with explicit source locations preserves full provenance, allowing downstream business logic or human reviewers to make an informed reconciliation.",
    takeaway: "Preserve conflicting source data in the structured output instead of forcing premature collapse into a single value."
  },
  {
    scenario: "Tool Interfaces & Identifiers",
    question: "An agent uses a `search_documents` tool to find files, and subsequently uses `share_document(document_id, email)` and `move_document(document_id, folder)` to act on them. How should the `search_documents` tool format its output to ensure reliable chaining?",
    options: [
      "Return clickable human-readable URLs.",
      "Return structured data containing `document_id` and metadata for each result.",
      "Return detailed prose summaries of the document contents.",
      "Return a simple list of document titles."
    ],
    correct: 1,
    why: "Multi-step workflows require clear input/output contracts. Because the downstream tools (share, move) require a specific machine-usable identifier (document_id), the upstream search tool must return exactly that ID in a structured format alongside the human-readable metadata.",
    takeaway: "Multi-step tool workflows require machine-usable identifiers; tools meant for chaining should always return structured data containing explicit IDs."
  },
  {
    scenario: "Agentic Tool Integration",
    question: "When designing agentic workflows, what is the primary advantage of enforcing structured JSON output for tool responses and agent outputs?",
    options: [
      "It makes the LLM's reasoning process perfectly deterministic.",
      "It ensures the semantic truth of the data fetched from backend APIs.",
      "It significantly reduces token consumption compared to standard text.",
      "It allows the agent and downstream systems to reliably access specific fields directly without parsing free-form text."
    ],
    correct: 3,
    why: "Structured outputs provide a stable schema contract. Instead of using regex or fuzzy text parsing to extract an account number or currency amount from a verbose prose response, downstream systems (and subsequent agent tools) can directly reference the exact JSON keys. This drastically reduces integration errors in chained operations.",
    takeaway: "Structured output gives agents reliable field access, preventing downstream errors associated with parsing free-form text."
  },
  {
    scenario: "Context & Tool Management",
    question: "An agent has access to over 50 different API connector tools. During execution, it frequently selects the wrong connector, even when explicitly instructed to search first. What is the most effective architectural change to fix this tool selection failure?",
    options: [
      "Rewrite the tool descriptions for all 50 connectors to be more detailed.",
      "Combine all 50 connectors into a single monolithic API call.",
      "Implement better error handling so the agent can recover after selecting the wrong connector.",
      "Provide a `search_connectors` tool that dynamically scopes the available tool set, exposing only the relevant matched connectors to the agent."
    ],
    correct: 3,
    why: "Exposing 50+ tools simultaneously degrades the model's decision-making accuracy (decision complexity). The architectural fix is to enforce dynamic scoping: the agent first calls search_connectors, and the system responds by injecting only the 2-3 matched, highly relevant connector tools into the agent's context for the next turn.",
    takeaway: "Reduce decision complexity by dynamically exposing only relevant tools to the agent, rather than dumping 50+ tools into the context window simultaneously."
  },
  {
    scenario: "Tool Schema Engineering",
    question: "An agent needs to query specific internal databases, but users often refer to them using ambiguous natural language (e.g., \"research database\" instead of \"db_res_01\"). How should the tool's input schema be designed to handle this reliably?",
    options: [
      "Use an `enum` parameter explicitly listing the allowed database system names.",
      "Use a freeform string parameter and use backend fuzzy matching to find the right database.",
      "Allow freeform strings but reject the tool call at runtime if the name is incorrect.",
      "Default to searching all databases simultaneously if the user is ambiguous."
    ],
    correct: 0,
    why: "Enums create a strict, constrained input contract. Providing an enum of exact backend values in the tool schema allows the model to leverage its semantic understanding to map the user's messy natural language (\"research database\") to the strict programmatic requirement (\"db_res_01\") before the tool executes.",
    takeaway: "Use `enum` fields in tool schemas to map ambiguous natural language to strict backend values, improving tool use reliability deterministically."
  },
  {
    scenario: "Tool Output Optimization",
    question: "A search tool automatically fetches and returns all matching records from a database. This frequently causes severe latency and context bloat, as most agent tasks only need the first few results. What is the best way to redesign this tool's output?",
    options: [
      "Silently limit the results to the top 5 most relevant hits.",
      "Return the first page of results along with pagination metadata (e.g., total count, cursor) so the agent can fetch more if needed.",
      "Create a separate `fetch_next_page` tool for the agent to use.",
      "Add a `max_pages` parameter to let the agent decide how many pages to fetch internally."
    ],
    correct: 1,
    why: "Returning hundreds of records wastes context and time. The optimal design is to return just the first page (e.g., 10 records) alongside metadata like total_matches and a next_cursor. This gives the agent the situational awareness to decide if it has enough information, or if it needs to pass the cursor back into the search tool to get page 2.",
    takeaway: "Return the first page with total match count and a cursor; give the agent explicit pagination state instead of incurring massive multi-page latency by default."
  },
  {
    scenario: "Security & Model Context Protocol",
    question: "A third-party Model Context Protocol (MCP) server provides tools annotated with `readOnlyHint=true`. You are designing the user confirmation flow for your agent application. How should you treat these tool annotations?",
    options: [
      "Trust the annotations automatically because the MCP server runs locally.",
      "Treat the annotations as untrusted metadata, and base your confirmation bypass policy on your trust of the vendor/server, not the self-reported labels.",
      "Infer the server's trustworthiness by testing the tools in a sandbox first.",
      "Bypass user confirmations safely, as the `readOnlyHint` guarantees no destructive actions can occur."
    ],
    correct: 1,
    why: "Tool annotations like readOnlyHint or destructiveHint are entirely self-reported by the MCP server. If the server itself is unvetted or third-party, its metadata cannot be trusted as a security boundary. Confirmation bypass policies should be built on explicit trust of the vendor providing the server, not just taking the server's word for it via annotations.",
    takeaway: "Treat MCP annotations as untrusted self-reported metadata unless the server itself is explicitly trusted by your system."
  },
  {
    scenario: "Tool Interface Design",
    question: "An agent frequently executes a two-step sequence: it calls `get_property_details(property_id)` to find an address, then passes that address to `get_neighborhood_info(address)`. This chaining increases latency and failure rates. How should the tool design be improved?",
    options: [
      "Merge both tools into a single `get_all_property_data` tool.",
      "Modify `get_neighborhood_info` to accept `property_id` directly and resolve the address internally.",
      "Improve the prompt to ensure the agent extracts the address more reliably.",
      "Create a middle-tier helper tool to manage the data handoff."
    ],
    correct: 1,
    why: "Forcing the agent to orchestrate a purely mechanical ID-to-string lookup wastes tokens, adds a failure point, and increases latency. If get_neighborhood_info frequently logically follows property identification, updating its interface to accept the property_id and handle the address lookup internally abstracts the complexity away from the LLM.",
    takeaway: "Design tools to internalize predictable dependencies (like ID lookups) to reduce avoidable chaining, latency, and failure coupling."
  },
  {
    scenario: "External Integrations & Tool Responses",
    question: "An agent tracks shipments using tools that call multiple different shipping carrier APIs. Each carrier returns timestamps, statuses, and delay codes in completely different JSON formats. How should you design the tool output provided to the agent?",
    options: [
      "Pass the raw JSON to the agent and provide extensive prompt instructions on how to parse each carrier's format.",
      "Normalize the carrier responses into a single common schema (e.g., `status`, `estimated_delivery`) before returning it to the agent.",
      "Create separate tracking tools for each carrier to keep the raw schemas distinct.",
      "Return both the normalized schema and the full raw response to maximize context."
    ],
    correct: 1,
    why: "Agents reason best over consistent, predictable data structures. Dumping heterogeneous, carrier-specific schemas into the context forces the LLM to expend attention on parsing formats rather than solving the user's core problem. Normalizing the output in your middleware abstracts away vendor quirks.",
    takeaway: "Normalize heterogeneous API responses into a consistent common schema before returning them to the agent to reduce cognitive load and improve reasoning."
  },
  {
    scenario: "Tool Input Brittleness",
    question: "An agent updates sports scores using an `update_game_score(date, team_name)` tool. The tool frequently fails due to ambiguous team nicknames, rematches on the same day, and date format variations. What is the most reliable tool design to fix this?",
    options: [
      "Require strict ISO-8601 date formats and official full team names in the tool schema.",
      "Improve the tool description to provide examples of correct formatting.",
      "Add regex validation to the tool parameters to catch formatting errors early.",
      "Introduce a `search_games` tool that returns a `game_id`, and update the scoring tool to accept only the `game_id`."
    ],
    correct: 3,
    why: "Natural language attributes (like dates and team names) are inherently ambiguous and brittle when used as database keys. The architectural fix is to separate discovery from action. Use a lookup tool (search_games) that returns a machine-usable identifier (game_id), and force the mutative tool (update_score) to rely exclusively on that strict identifier.",
    takeaway: "Replace tools relying on ambiguous human-entered text fields with a two-step lookup/action pattern utilizing strict machine-usable identifiers (IDs)."
  },
  {
    scenario: "System Boundaries & Security",
    question: "An agent processes employee reimbursements. Company policy dictates that payouts over $500 must go to a pending approval queue and cannot be disbursed automatically. You need to ensure this threshold absolutely cannot be bypassed by the agent. Where should this rule be enforced?",
    options: [
      "Add a `requires_approval` boolean parameter to the tool schema that the agent must set.",
      "Enforce the $500 threshold inside the `process_reimbursement` tool logic itself.",
      "Write a strict system prompt instructing the agent to never disburse amounts over $500.",
      "Provide two separate tools (`disburse` and `request_approval`) and trust the agent to select correctly."
    ],
    correct: 1,
    why: "If a rule cannot be bypassed, it must be enforced deterministically in the backend, not probabilistically in the LLM. Implementing the threshold inside the tool code guarantees that even if the agent hallucinates or is subjected to prompt injection, any payload over $500 will gracefully degrade to a \"pending approval\" state without breaking policy.",
    takeaway: "Strict business rules and approval thresholds must be enforced deterministically inside the backend tool logic, never via prompt instructions or agent tool selection."
  },
  {
    scenario: "Tool Schema Documentation",
    question: "During execution, an agent repeatedly struggles to format inputs correctly for `user_id` and `fields_to_update` when calling an update tool. What is the most effective way to help the model understand exactly what values and formats to provide?",
    options: [
      "Write clear, detailed parameter descriptions in the tool schema.",
      "Make the JSON schema extremely strict with complex regex constraints.",
      "Rename the tool to include formatting hints in the tool name itself.",
      "Add error-handling logic that explains the formatting rules only when the tool fails."
    ],
    correct: 0,
    why: "Tool descriptions and parameter descriptions are the primary mechanism models use to understand expected inputs, formats, examples, and boundaries. Writing explicit instructions on a property (e.g., \"description\": \"UUID of the user to update (required)\") directly guides the model's token generation prior to tool execution.",
    takeaway: "Clear, detailed parameter descriptions in the JSON schema are the primary and most important mechanism for guiding a model on input formatting."
  },
  {
    scenario: "Error Recovery in Workflows",
    question: "A tool experiences two types of errors: transient network timeouts, and permanent user syntax errors. How should the tool handle these errors to optimize the agent workflow?",
    options: [
      "Pass all errors to the agent and prompt it to retry timeouts but stop on syntax errors.",
      "Automatically retry transient network timeouts inside the tool, but immediately return syntax errors with clear validation details to the agent.",
      "Uniformly auto-retry all errors 3 times before returning a failure message to the agent.",
      "Return all errors immediately to the agent as generic 'Tool Execution Failed' messages."

      "Start a new session every 20 turns with no carryover."
    ],
    correct: 1,
    why: "Unbounded conversation history causes three compounding problems: context window saturation, increased latency (processing more tokens), and higher costs. Hard truncation loses critical early context (like the user's original issue). The optimal pattern is a sliding window: keep the system prompt, maintain a compressed summary of older turns (preserving key facts and decisions), and include the most recent N turns verbatim for continuity. This bounds cost and latency while preserving essential context.",
    takeaway: "Use a sliding window with a running summary for long conversations—keep the system prompt, summarize old turns, and preserve recent turns verbatim to bound cost without losing critical context."
  },
  {
    scenario: "Token Optimization & Architecture",
    question: "A document processing pipeline sends the same 40,000-token reference manual as context with every API call. The system makes ~200 calls per hour. The team wants to reduce costs without degrading output quality. Which combination of techniques provides the greatest cost reduction?",
    options: [
      "Summarize the reference manual to 5,000 tokens and send the summary instead.",
      "Use prompt caching on the reference manual and switch low-complexity calls to a cheaper model tier.",
      "Move all calls to the Batch API for the 50% discount.",
      "Split the reference manual across multiple smaller API calls."
    ],
    correct: 1,
    why: "Prompt caching reduces the 40,000-token reference manual from full input price to 10% on cache hits (90% savings on that prefix). At 200 calls/hour with a 5-minute TTL, the cache stays perpetually warm. Additionally, routing simpler calls to a cheaper model (e.g., Haiku at $1/MTok vs Opus at $5/MTok) compounds the savings. Summarizing risks losing critical reference details. The Batch API helps but has a 24-hour latency window unsuitable for real-time processing.",
    takeaway: "Combine prompt caching for repeated static content with model-tier routing for variable complexity—these two techniques compound cost savings without sacrificing quality."
  },
  {
    scenario: "Evaluation & Testing",
    question: "A team launches an AI-powered contract analysis tool. During development, they tested against 50 hand-labeled contracts and achieved 94% accuracy. In production, accuracy drops to 78%. Investigation reveals the test set contained only standard commercial contracts, but production traffic includes government contracts, international agreements, and employment contracts. What testing methodology should they adopt?",
    options: [
      "Increase the test set to 500 contracts of the same type.",
      "Build a stratified evaluation set that mirrors the actual production distribution across all contract types, and measure accuracy per category.",
      "Use an LLM-as-judge to evaluate production outputs automatically.",
      "A/B test the current prompt against a revised prompt on live traffic."
    ],
    correct: 1,
    why: "The root cause is evaluation set bias—the test set didn't represent the true production distribution. A larger set of the same type would reinforce the same blind spot. The fix is stratified evaluation: build a test set that includes representative samples from every contract category seen in production, weighted by actual traffic distribution. Measuring accuracy per category reveals which contract types need prompt or pipeline improvements.",
    takeaway: "Build evaluation sets that mirror production distributions with stratified sampling across all input categories—aggregate accuracy metrics mask per-category failures."
  },
  {
    scenario: "Human-in-the-Loop Architecture",
    question: "An insurance claims processing system uses Claude to assess claim validity. Regulators require that all denied claims have human oversight, but approved claims can be fully automated. The model outputs a `decision` field (approve/deny) and a `confidence` score. What is the most effective escalation architecture?",
    options: [
      "Route all claims with confidence below 80% to human reviewers.",
      "Route all denied claims to a human review queue regardless of confidence, and auto-approve claims above a validated confidence threshold.",
      "Use a second LLM to review all denied claims before they reach humans.",
      "Require human review for all claims to satisfy regulators."
    ],
    correct: 1,
    why: "The regulatory constraint is asymmetric: denials require human oversight, approvals do not. The architecture should reflect this asymmetry. All denials go to human review (satisfying the regulatory mandate), while approvals above a validated confidence threshold are automated (maximizing throughput). This keeps the human review queue focused on the decisions that matter most—denials—rather than drowning reviewers in confident approvals. A blanket confidence-based routing ignores the regulatory structure.",
    takeaway: "Design escalation flows around the specific regulatory and business constraints—asymmetric requirements (e.g., all denials need review) should drive asymmetric routing, not uniform confidence thresholds."
  },
  {
    scenario: "Routing & Classification Patterns",
    question: "A multi-purpose AI assistant handles coding questions, creative writing, math problems, and general knowledge queries. Using a single Opus model for everything works well but is expensive. The team wants to implement intelligent routing but is concerned about misrouted requests degrading quality. What is the safest routing architecture?",
    options: [
      "Use keyword matching to route requests to specialized models.",
      "Use a fast classifier model to categorize requests, route simple categories to cheaper models, and include a fallback that escalates uncertain classifications to the most capable model.",
      "Let users self-select their request category via a dropdown menu.",
      "Route everything to Haiku first and only escalate to Opus if the response quality score is below a threshold."
    ],
    correct: 1,
    why: "A lightweight classifier (Haiku-based) can categorize most requests cheaply and accurately. Simple categories (general knowledge, basic coding) route to Sonnet or Haiku. Complex categories (advanced reasoning, creative writing) route to Opus. The critical design element is the fallback: when the classifier's confidence is low, the request escalates to Opus rather than risking a misroute to a less capable model. This preserves quality for ambiguous cases while capturing cost savings on clear-cut ones.",
    takeaway: "Implement routing with a classifier that includes a high-capability fallback for uncertain classifications—never allow low-confidence routing to degrade to a cheaper model."
  },
  {
    scenario: "Client vs Server Tool Architecture",
    question: "An application needs Claude to both search the web for current information and execute database queries against a proprietary internal database. The team is deciding how to implement these as tools. What is the correct architectural distinction?",
    options: [
      "Implement both as client tools executed by the application.",
      "Implement both as server tools executed by Anthropic's infrastructure.",
      "Use Anthropic's built-in `web_search` server tool for web searches, and implement the database query as a client tool executed by the application's backend.",
      "Use MCP servers for both to keep the architecture uniform."
    ],
    correct: 2,
    why: "Server tools (like `web_search`) run on Anthropic's infrastructure—you see results directly without handling execution. Client tools run in your application: Claude returns a `tool_use` block, your code executes it, and you send back a `tool_result`. Web search is a built-in server tool Anthropic provides. The proprietary database query must be a client tool because it requires access to your internal infrastructure that Anthropic's servers cannot reach. Using the correct tool type for each avoids unnecessary implementation work and security exposure.",
    takeaway: "Use Anthropic-provided server tools (web_search, code_execution) for standard capabilities, and implement client tools for proprietary/internal operations that require your infrastructure."
  },
  {
    scenario: "Structured Output Enforcement",
    question: "A healthcare data pipeline extracts patient information into a strict JSON schema. Any deviation from the schema—extra fields, missing required fields, wrong types—causes downstream system failures. The team currently uses prompt instructions to enforce the schema but still sees ~3% malformed responses. What is the most reliable enforcement mechanism?",
    options: [
      "Add more examples of correct output to the prompt.",
      "Enable `strict: true` on the tool definition to guarantee schema conformance at the API level.",
      "Post-process all responses with a JSON schema validator and retry on failures.",
      "Use a smaller model that is more predictable in its output format."
    ],
    correct: 1,
    why: "Setting `strict: true` on a tool definition makes the API guarantee that Claude's tool call inputs always match the provided JSON schema exactly. This is a deterministic, API-level enforcement—not a probabilistic prompt-level instruction. The model is constrained during generation to only produce tokens that conform to the schema. Post-processing with retries adds latency and cost. More examples help but don't guarantee compliance.",
    takeaway: "Use `strict: true` in tool definitions for guaranteed schema conformance—this is a deterministic API-level constraint, not a probabilistic prompt instruction."
  },
  {
    scenario: "Idempotency & Tool Safety",
    question: "An e-commerce agent uses a `place_order` tool. Due to network instability, the agent occasionally receives timeout errors and retries the tool call. This has resulted in duplicate orders being placed for the same customer. How should the tool be redesigned to prevent this?",
    options: [
      "Add a confirmation step requiring the agent to verify before placing each order.",
      "Require the agent to pass an `idempotency_key` (e.g., derived from cart_id + timestamp) that the backend uses to deduplicate retries.",
      "Disable automatic retries entirely and surface all errors to the user.",
      "Add a `check_order_status` tool and instruct the agent to verify before retrying."
    ],
    correct: 1,
    why: "Idempotency keys are the standard engineering pattern for safe retries on mutative operations. The agent generates a unique key per logical action (e.g., hash of cart_id + user_id + timestamp). If the backend receives the same key twice, it returns the result of the first execution without re-executing. This makes retries safe at the infrastructure level, without requiring the agent to reason about whether a prior attempt succeeded—which is error-prone for LLMs dealing with ambiguous timeout states.",
    takeaway: "Design mutative tools with idempotency keys so retries are safe at the infrastructure level—never rely on the agent to correctly deduce whether a prior call succeeded."
  },
  {
    scenario: "Agentic Loop Termination",
    question: "A research agent is tasked with gathering information on a topic. It has access to search and document reading tools. During testing, the agent occasionally enters an infinite loop—repeatedly searching for the same query, reading the same documents, and never producing a final answer. What is the best architectural safeguard?",
    options: [
      "Set a low `max_tokens` to force the agent to stop generating.",
      "Implement a maximum turn count (e.g., 15 tool calls), a loop detection mechanism that flags repeated identical tool calls, and a mandatory synthesis step after the budget is exhausted.",
      "Remove the search tool after the first 5 results are found.",
      "Add a prompt instruction telling the agent to stop after finding enough information."
    ],
    correct: 1,
    why: "Runaway loops are an inherent risk in agentic systems. A robust termination architecture has three layers: (1) a hard turn/tool-call budget that guarantees termination, (2) a loop detector that identifies repeated identical calls and breaks the cycle early, and (3) a forced synthesis step that requires the agent to produce output from whatever it has gathered when the budget is reached. Prompt instructions alone are insufficient—the agent is already in a loop precisely because it's not following instructions correctly.",
    takeaway: "Implement multi-layered loop protection: hard turn budgets, duplicate-call detection, and forced synthesis—prompt instructions alone cannot reliably prevent agentic loops."
  }
];

const LETTERS = ["A", "B", "C", "D", "E"];

let current = 0;
let correct = 0;
let wrong = 0;
let answers = []; // {chosen, isCorrect}

function updateScoreboard() {
  document.getElementById("score-correct").textContent = correct;
  document.getElementById("score-wrong").textContent = wrong;
  document.getElementById("score-remaining").textContent = questions.length - current;
  const pct = (current / questions.length) * 100;
  document.getElementById("progress-bar").style.width = pct + "%";
  document.getElementById("progress-label").textContent = `${current} / ${questions.length}`;
}

function renderDots() {
  const wrap = document.getElementById("nav-dots");
  wrap.innerHTML = "";
  questions.forEach((_, i) => {
    const d = document.createElement("div");
    d.className = "dot";
    if (i < answers.length) {
      d.classList.add(answers[i].isCorrect ? "answered-correct" : "answered-wrong");
    } else if (i === current) {
      d.classList.add("current");
    }
    wrap.appendChild(d);
  });
}

function renderQuestion(idx) {
  const q = questions[idx];
  const container = document.getElementById("quiz-container");
  container.innerHTML = "";

  const card = document.createElement("div");
  card.className = "question-card";

  card.innerHTML = `
    <div class="question-meta">
      <span class="q-number">Question ${idx + 1} of ${questions.length}</span>
      <span class="q-scenario">${q.scenario}</span>
    </div>
    <p class="question-text">${q.question}</p>
    <div class="options" id="options-${idx}"></div>
    <div class="explanation" id="explanation-${idx}">
      <div class="explanation-header" id="exp-header-${idx}"></div>
      <p class="explanation-body" id="exp-body-${idx}"></p>
      <div class="takeaway"><span class="takeaway-label">Exam Takeaway:</span>${q.takeaway}</div>
      <button class="next-btn" id="next-btn-${idx}">${idx === questions.length - 1 ? "See Results" : "Next Question →"}</button>
    </div>
  `;

  container.appendChild(card);

  const optWrap = document.getElementById(`options-${idx}`);
  q.options.forEach((opt, oi) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="option-letter">${LETTERS[oi]}</span><span>${opt}</span>`;
    btn.addEventListener("click", () => handleAnswer(idx, oi));
    optWrap.appendChild(btn);
  });

  document.getElementById(`next-btn-${idx}`).addEventListener("click", () => {
    current++;
    updateScoreboard();
    renderDots();
    if (current >= questions.length) {
      showResults();
    } else {
      renderQuestion(current);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  });
}

function handleAnswer(idx, chosen) {
  const q = questions[idx];
  const isCorrect = chosen === q.correct;

  if (isCorrect) correct++; else wrong++;
  answers.push({ chosen, isCorrect });

  // Disable all buttons
  const optBtns = document.querySelectorAll(`#options-${idx} .option-btn`);
  optBtns.forEach((btn, oi) => {
    btn.disabled = true;
    if (oi === q.correct) btn.classList.add("correct");
    if (oi === chosen && !isCorrect) btn.classList.add("wrong");
  });

  // Show explanation
  const exp = document.getElementById(`explanation-${idx}`);
  const hdr = document.getElementById(`exp-header-${idx}`);
  const body = document.getElementById(`exp-body-${idx}`);
  exp.classList.add("show");

  if (isCorrect) {
    hdr.textContent = "Correct!";
    hdr.className = "explanation-header correct-hdr";
    body.textContent = q.why;
  } else {
    hdr.textContent = `Incorrect — Correct answer: ${LETTERS[q.correct]}`;
    hdr.className = "explanation-header wrong-hdr";
    body.textContent = q.why;
  }

  updateScoreboard();
  renderDots();
}

function showResults() {
  document.getElementById("quiz-container").style.display = "none";
  document.getElementById("nav-dots").style.display = "none";
  const results = document.getElementById("results");
  results.style.display = "block";

  const pct = Math.round((correct / questions.length) * 100);
  let grade = pct >= 90 ? "Excellent!" : pct >= 75 ? "Good work!" : pct >= 60 ? "Keep practicing!" : "Needs review";
  let gradeColor = pct >= 90 ? "var(--correct)" : pct >= 75 ? "var(--accent)" : pct >= 60 ? "var(--warn)" : "var(--wrong)";

  const wrongItems = answers.map((a, i) => ({ ...a, q: questions[i], idx: i })).filter(a => !a.isCorrect);

  results.innerHTML = `
    <div class="results-card">
      <h2>${grade}</h2>
      <div class="score-big" style="color:${gradeColor}">${pct}%</div>
      <div class="score-label">Overall Score</div>
      <div class="grade-bar"><div class="grade-bar-fill" style="width:${pct}%;background:${gradeColor}"></div></div>
      <div class="results-stats">
        <div class="stat-box stat-correct">
          <div class="stat-val">${correct}</div>
          <div class="stat-lbl">Correct</div>
        </div>
        <div class="stat-box stat-wrong">
          <div class="stat-val">${wrong}</div>
          <div class="stat-lbl">Wrong</div>
        </div>
        <div class="stat-box">
          <div class="stat-val">${questions.length}</div>
          <div class="stat-lbl">Total</div>
        </div>
      </div>
    </div>

    ${wrongItems.length > 0 ? `
    <div class="review-section">
      <h3>Review — Questions You Missed (${wrongItems.length})</h3>
      ${wrongItems.map(item => `
        <div class="review-item wrong-item">
          <div class="review-q">Q${item.idx + 1}: ${item.q.question}</div>
          <div class="review-answer">
            Your answer: <strong>${LETTERS[item.chosen]} — ${item.q.options[item.chosen]}</strong><br/>
            Correct answer: <strong>${LETTERS[item.q.correct]} — ${item.q.options[item.q.correct]}</strong><br/>
            <em style="font-size:0.8rem;display:block;margin-top:0.4rem;">${item.q.takeaway}</em>
          </div>
        </div>
      `).join("")}
    </div>` : `<div class="review-section"><h3>Perfect score — all questions correct!</h3></div>`}

    <button class="restart-btn" onclick="restartQuiz()">Restart Quiz</button>
  `;

  window.scrollTo({ top: 0, behavior: "smooth" });
}

function restartQuiz() {
  current = 0; correct = 0; wrong = 0; answers = [];
  document.getElementById("quiz-container").style.display = "";
  document.getElementById("nav-dots").style.display = "";
  document.getElementById("results").style.display = "none";
  updateScoreboard();
  renderDots();
  renderQuestion(0);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// Init
updateScoreboard();
renderDots();
renderQuestion(0);
</script>
</body>
</html>
